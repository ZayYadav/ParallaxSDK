name: Sign ONECORE APK with Original Key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-onecore-original-key
  cancel-in-progress: false

jobs:
  sign:
    name: Re-sign ONECORE.apk with production certificate
    runs-on: ubuntu-latest

    env:
      SOURCE_APK: ONECORE.apk
      OUTPUT_DIR: signed-onecore
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;36.0.0"

      - name: Validate source APK and production signing secrets
        shell: bash
        run: |
          set -euo pipefail

          test -f "${SOURCE_APK}" || {
            echo "::error::${SOURCE_APK} was not found in the repository root."
            exit 1
          }

          for var in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required production signing value ${var} is missing."
              exit 1
            fi
          done

      - name: Decode production keystore
        id: keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_FILE="${RUNNER_TEMP}/onecore-production.jks"
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE_FILE}"
          chmod 600 "${KEYSTORE_FILE}"

          keytool -list             -keystore "${KEYSTORE_FILE}"             -storepass "${STORE_PASSWORD}"             -alias "${KEY_ALIAS}" >/dev/null

          KEYSTORE_CERT_SHA256="$(
            keytool -exportcert -rfc               -keystore "${KEYSTORE_FILE}"               -storepass "${STORE_PASSWORD}"               -alias "${KEY_ALIAS}"             | openssl x509 -outform DER             | sha256sum             | awk '{print $1}'
          )"

          normalize_hash() {
            printf '%s' "$1" | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]'
          }

          ACTUAL="$(normalize_hash "${KEYSTORE_CERT_SHA256}")"

          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            MATCHED=false
            IFS=',' read -ra APPROVED_CERTS <<< "${EXPECTED_CERT_SHA256}"
            for item in "${APPROVED_CERTS[@]}"; do
              EXPECTED="$(normalize_hash "${item}")"
              if [ "${#EXPECTED}" -ne 64 ]; then
                echo "::error::ONECORE_ALLOWED_SIGNING_SHA256 contains an invalid SHA-256 digest."
                exit 1
              fi
              if [ "${ACTUAL}" = "${EXPECTED}" ]; then
                MATCHED=true
                break
              fi
            done

            if [ "${MATCHED}" != "true" ]; then
              echo "::error::Decoded keystore certificate is not in ONECORE_ALLOWED_SIGNING_SHA256."
              echo "Decoded certificate SHA-256: ${ACTUAL}"
              exit 1
            fi
          else
            echo "::warning::ONECORE_ALLOWED_SIGNING_SHA256 is not configured; using the production keystore certificate as the signing source of truth."
          fi

          echo "Production signing certificate verified: ${ACTUAL}"
          echo "path=${KEYSTORE_FILE}" >> "${GITHUB_OUTPUT}"
          echo "cert_sha256=${ACTUAL}" >> "${GITHUB_OUTPUT}"

      - name: Record current APK signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"

          {
            echo "Source APK: ${SOURCE_APK}"
            echo "Source SHA-256: $(sha256sum "${SOURCE_APK}" | awk '{print $1}')"
            echo
            echo "Existing signature:"
            if "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "${SOURCE_APK}"; then
              :
            else
              echo "Source APK is unsigned or its existing signature could not be verified."
            fi
          } | tee "${OUTPUT_DIR}/source-signature.txt"

      - name: Zipalign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"             -f -p 4             "${SOURCE_APK}"             "${RUNNER_TEMP}/ONECORE-aligned.apk"

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"             -c -v 4             "${RUNNER_TEMP}/ONECORE-aligned.apk" >/dev/null

      - name: Sign APK with original ONECORE production key
        shell: bash
        run: |
          set -euo pipefail

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign             --ks "${{ steps.keystore.outputs.path }}"             --ks-key-alias "${KEY_ALIAS}"             --ks-pass env:STORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "${OUTPUT_DIR}/ONECORE-original-signed.apk"             "${RUNNER_TEMP}/ONECORE-aligned.apk"

      - name: Verify final APK certificate
        shell: bash
        run: |
          set -euo pipefail

          SIGNED_APK="${OUTPUT_DIR}/ONECORE-original-signed.apk"
          REPORT="${OUTPUT_DIR}/signing-report.txt"

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify             --verbose             --print-certs             "${SIGNED_APK}" | tee "${REPORT}"

          "${ANDROID_HOME}/build-tools/36.0.0/zipalign"             -c -v 4             "${SIGNED_APK}" >/dev/null

          FINAL_CERT="$(
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "${REPORT}"               | tr -cd '[:xdigit:]'               | tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED="${{ steps.keystore.outputs.cert_sha256 }}"

          if [ -z "${FINAL_CERT}" ]; then
            echo "::error::Could not read final APK certificate SHA-256."
            exit 1
          fi

          if [ "${FINAL_CERT}" != "${EXPECTED}" ]; then
            echo "::error::Final APK was not signed with the expected ONECORE production certificate."
            echo "Final certificate SHA-256: ${FINAL_CERT}"
            echo "Expected certificate SHA-256: ${EXPECTED}"
            exit 1
          fi

          {
            echo
            echo "Final APK SHA-256: $(sha256sum "${SIGNED_APK}" | awk '{print $1}')"
            echo "Verified production certificate SHA-256: ${FINAL_CERT}"
          } | tee -a "${REPORT}"

      - name: Upload signed ONECORE APK
        uses: actions/upload-artifact@v6
        with:
          name: ONECORE-original-key-signed
          path: signed-onecore/ONECORE-original-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signing verification report
        uses: actions/upload-artifact@v6
        with:
          name: ONECORE-signing-report
          path: |
            signed-onecore/source-signature.txt
            signed-onecore/signing-report.txt
          if-no-files-found: error
          retention-days: 30
