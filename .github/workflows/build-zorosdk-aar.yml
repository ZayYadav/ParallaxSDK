name: Build ZOROSDK SDK AAR

on:
  workflow_dispatch:
  push:
    branches:
      - ZOROSDK
    paths:
      - 'ZOROSDK/BLACK-OPNE/**'
      - '.github/workflows/build-zorosdk-aar.yml'

permissions:
  contents: read

jobs:
  build-aar:
    name: Build ZOROSDKCore release AAR
    runs-on: ubuntu-latest
    env:
      SDK_PROJECT_DIR: ZOROSDK/BLACK-OPNE
      NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

      - name: Configure SDK
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          chmod +x "${SDK_PROJECT_DIR}/gradlew"

      - name: Build release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ZOROSDKCore:assembleRelease --no-daemon --stacktrace

      - name: Verify AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR="${SDK_PROJECT_DIR}/RIYAZ-VIP/build/outputs/aar/ZOROSDKCore-release.aar"
          test -s "$AAR"
          unzip -tq "$AAR"
          sha256sum "$AAR"

      - name: Upload ZOROSDK AAR
        uses: actions/upload-artifact@v4
        with:
          name: ZOROSDKCore-release-aar
          path: ${{ env.SDK_PROJECT_DIR }}/RIYAZ-VIP/build/outputs/aar/ZOROSDKCore-release.aar
          if-no-files-found: error
          retention-days: 30
