name: Build Loader Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'One-Core-Engine/**'
      - '.github/workflows/build-loader-only.yml'
  pull_request:
    paths:
      - 'One-Core-Engine/**'
      - '.github/workflows/build-loader-only.yml'

permissions:
  contents: read

concurrency:
  group: loader-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-loader:
    name: Build Loader APKs from bundled AAR
    runs-on: ubuntu-latest

    env:
      LOADER_PROJECT_DIR: One-Core-Engine
      LOADER_AAR_PATH: One-Core-Engine/app/libs/ParallaxCore-release.aar
      NDK_VERSION: 27.2.12479018
      BUILD_LOG_DIR: loader-only-build-logs
      PARALLAX_API_PUBLIC_KEY_B64: ${{ vars.PARALLAX_API_PUBLIC_KEY_B64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ONECORE_ALLOWED_SIGNING_SHA256: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Loader Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

      - name: Configure Loader Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${LOADER_PROJECT_DIR}/local.properties"
          chmod +x "${LOADER_PROJECT_DIR}/gradlew"
          mkdir -p "${BUILD_LOG_DIR}"

      - name: Validate bundled ParallaxCore AAR
        shell: bash
        run: |
          set -euo pipefail
          test -s "${LOADER_AAR_PATH}"
          unzip -tq "${LOADER_AAR_PATH}"
          sha256sum "${LOADER_AAR_PATH}" | tee "${BUILD_LOG_DIR}/bundled-aar.sha256"

      - name: Configure Loader encrypted transport and artifact tier
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PARALLAX_API_PUBLIC_KEY_B64:-}" ]; then
            echo 'PARALLAX_HAS_RELEASE_TRANSPORT=true' >> "$GITHUB_ENV"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out /tmp/parallax-loader-only-private.pem 2>/dev/null
            PUBLIC_KEY=$(openssl pkey \
              -in /tmp/parallax-loader-only-private.pem \
              -pubout -outform DER 2>/dev/null | base64 -w0)
            rm -f /tmp/parallax-loader-only-private.pem
            echo "PARALLAX_API_PUBLIC_KEY_B64=${PUBLIC_KEY}" >> "$GITHUB_ENV"
            echo 'PARALLAX_HAS_RELEASE_TRANSPORT=false' >> "$GITHUB_ENV"
            echo 'WARNING: using non-production application-layer encryption configuration for this CI build.'
          fi

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${STORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'PARALLAX_HAS_RELEASE_SIGNING=true' >> "$GITHUB_ENV"
          else
            echo 'PARALLAX_HAS_RELEASE_SIGNING=false' >> "$GITHUB_ENV"
            echo 'WARNING: using the CI fallback signing certificate for this build.'
          fi

          if [ -n "${PARALLAX_API_PUBLIC_KEY_B64:-}" ] \
            && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${STORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo 'PARALLAX_ARTIFACT_TIER=production' >> "$GITHUB_ENV"
          else
            echo 'PARALLAX_ARTIFACT_TIER=ci-nonproduction' >> "$GITHUB_ENV"
          fi

      - name: Validate encrypted Loader protocol configuration
        shell: python
        run: |
          import base64
          import os

          try:
              public_key = base64.b64decode(
                  os.environ.get("PARALLAX_API_PUBLIC_KEY_B64", ""),
                  validate=True,
              )
          except Exception as error:
              raise SystemExit("PARALLAX_API_PUBLIC_KEY_B64 is invalid") from error
          if len(public_key) < 256 or len(public_key) > 1024:
              raise SystemExit("PARALLAX_API_PUBLIC_KEY_B64 has an invalid DER size")

      - name: Configure Loader signing keystore
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE=$(awk -F= '/^storeFile=/{print $2}' signing.properties)
          CONFIG_STORE_PASSWORD=$(awk -F= '/^storePassword=/{print $2}' signing.properties)
          CONFIG_KEY_ALIAS=$(awk -F= '/^keyAlias=/{print $2}' signing.properties)
          CONFIG_KEY_PASSWORD=$(awk -F= '/^keyPassword=/{print $2}' signing.properties)
          test -n "$STORE_FILE"

          if [ "${PARALLAX_HAS_RELEASE_SIGNING}" = 'true' ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          elif [ ! -f "$STORE_FILE" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            keytool -genkeypair \
              -keystore "$STORE_FILE" \
              -storetype JKS \
              -storepass "$CONFIG_STORE_PASSWORD" \
              -keypass "$CONFIG_KEY_PASSWORD" \
              -alias "$CONFIG_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Loader Only CI,O=Parallax,C=US'
          fi
          test -s "$STORE_FILE"

      - name: Build signed Loader release APK
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "../${BUILD_LOG_DIR}/loader-release-apk.log"

      - name: Verify Loader release APK and packaged DEX
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"

          DEX_DIR=$(mktemp -d)
          unzip -qq "$RELEASE_APK" 'classes*.dex' -d "$DEX_DIR"
          DEX_COUNT=0
          for dex in "$DEX_DIR"/classes*.dex; do
            "${ANDROID_HOME}/build-tools/36.0.0/dexdump" -f "$dex" >/dev/null
            DEX_COUNT=$((DEX_COUNT + 1))
          done
          test "$DEX_COUNT" -gt 0

          for plaintext in \
            'https://parallaxloader.parallaxserver.online/api/v2/connect' \
            'parallax-license-v2-request' \
            'parallax-license-v2-response:' \
            'accounts.google.com' \
            'www.facebook.com' \
            'oauth.x.com' \
            'IGmsServiceBroker'; do
            if grep -aF -- "$plaintext" "$DEX_DIR"/classes*.dex; then
              echo "Sensitive plaintext remains in release DEX: $plaintext" >&2
              exit 1
            fi
          done

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$RELEASE_APK" >/dev/null
          printf 'source=bundled-aar\ndex_files=%s\n' "$DEX_COUNT" \
            | tee "${BUILD_LOG_DIR}/loader-only-verification.txt"

      - name: Build Loader debug APK
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace \
            2>&1 | tee "../${BUILD_LOG_DIR}/loader-debug-apk.log"

      - name: Verify Loader debug APK
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)
          test -n "$DEBUG_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$DEBUG_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$DEBUG_APK" >/dev/null

      - name: Record Loader artifact information
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)
          DEBUG_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          test -n "$DEBUG_APK"

          CURRENT_AAR_SHA=$(sha256sum "${LOADER_AAR_PATH}")
          diff -u "${BUILD_LOG_DIR}/bundled-aar.sha256" <(printf '%s\n' "$CURRENT_AAR_SHA")
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --print-certs "$RELEASE_APK" \
            | tee "${BUILD_LOG_DIR}/loader-signing-certificate.txt"
          {
            printf 'artifact_tier=%s\n' "${PARALLAX_ARTIFACT_TIER}"
            printf 'production_transport=%s\n' "${PARALLAX_HAS_RELEASE_TRANSPORT}"
            printf 'production_signing=%s\n' "${PARALLAX_HAS_RELEASE_SIGNING}"
            printf 'parallaxcore_source=repository-bundled-aar\n'
            printf 'commit=%s\n' "${GITHUB_SHA}"
            if [ "${PARALLAX_ARTIFACT_TIER}" != 'production' ]; then
              printf 'warning=CI verification build only; configure production application-layer encryption and signing before distribution.\n'
            fi
            sha256sum "${LOADER_AAR_PATH}" "$RELEASE_APK" "$DEBUG_APK"
          } | tee "${BUILD_LOG_DIR}/loader-only-artifact-info.txt"

      - name: Upload Loader release APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-only-${{ env.PARALLAX_ARTIFACT_TIER }}-release-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Loader debug APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-only-${{ env.PARALLAX_ARTIFACT_TIER }}-debug-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Loader-only build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: loader-only-build-logs
          path: ${{ env.BUILD_LOG_DIR }}/
          if-no-files-found: warn
