name: Build ParallaxCore

on:
  workflow_dispatch:
  push:
    branches: [ParallaxCore]
    paths:
      - 'ParallaxCore/**'
      - 'scripts/rebrand_parallaxcore.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - '.github/workflows/build-parallax-core.yml'

permissions:
  contents: write

jobs:
  rebrand-build:
    name: Rebrand and verify ParallaxCore
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout ParallaxCore
        uses: actions/checkout@v4
        with:
          ref: ParallaxCore
          fetch-depth: 1
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Rebrand all SDK-owned packages and primary types
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rebrand_parallaxcore.py

      - name: Normalize Android and generated namespace references
        shell: bash
        run: |
          set -euo pipefail
          # These are Android framework nested classes, not SDK-owned types.
          grep -RIl 'ActivityManager.ParallaxRunningServiceInfo' ParallaxCore/src/main/java \
            | xargs -r sed -i 's/ActivityManager\.ParallaxRunningServiceInfo/ActivityManager.RunningServiceInfo/g'
          grep -RIl 'ActivityManager.ParallaxRunningAppProcessInfo' ParallaxCore/src/main/java \
            | xargs -r sed -i 's/ActivityManager\.ParallaxRunningAppProcessInfo/ActivityManager.RunningAppProcessInfo/g'

          # R and BuildConfig are generated at the Android module namespace root.
          grep -RIl 'com.Parallax.SDK.core.R' ParallaxCore/src/main/java \
            | xargs -r sed -i 's/com\.Parallax\.SDK\.core\.R/com.Parallax.SDK.R/g'
          grep -RIl 'com.Parallax.SDK.core.BuildConfig' ParallaxCore/src/main/java \
            | xargs -r sed -i 's/com\.Parallax\.SDK\.core\.BuildConfig/com.Parallax.SDK.BuildConfig/g'

          # ParallaxCore moved out of the Android namespace root, so its old
          # package-local R reference now needs an explicit generated R import.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ParallaxCore/src/main/java/com/Parallax/SDK/core/ParallaxCore.java')
          text = path.read_text(encoding='utf-8')
          if 'R.string.' in text and 'import com.Parallax.SDK.R;' not in text:
              marker = 'package com.Parallax.SDK.core;\n'
              if marker not in text:
                  raise SystemExit('Unexpected ParallaxCore package declaration')
              text = text.replace(marker, marker + '\nimport com.Parallax.SDK.R;\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

          # The type rebrand also renamed the ProxyManifest helper method because
          # it shared a name with the TransparentProxyActivity class. Align its
          # callers with the migrated method name.
          grep -RIl 'ParallaxProxyManifest.TransparentProxyActivity(' ParallaxCore/src/main/java \
            | xargs -r sed -i 's/ParallaxProxyManifest\.TransparentProxyActivity(/ParallaxProxyManifest.ParallaxTransparentProxyActivity(/g'

          # Fail early if the known invalid rebrand forms ever return.
          ! grep -R -n -E 'ActivityManager\.ParallaxRunning(Service|AppProcess)Info|com\.Parallax\.SDK\.core\.(R|BuildConfig)|ParallaxProxyManifest\.TransparentProxyActivity\(' \
            ParallaxCore/src/main/java

      - name: Verify public Parallax API
        shell: bash
        run: |
          set -euo pipefail
          test -f ParallaxCore/src/main/java/com/Parallax/SDK/ParallaxSDK.java
          grep -F 'package com.Parallax.SDK;' ParallaxCore/src/main/java/com/Parallax/SDK/ParallaxSDK.java
          grep -F 'public static void activate' ParallaxCore/src/main/java/com/Parallax/SDK/ParallaxSDK.java
          grep -F 'namespace "com.Parallax.SDK"' ParallaxCore/build.gradle
          ! grep -R -n -E 'top\.niunaijun\.blackbox|top\.niunaijun\.jnihook|net_62v|android\.MetaCore' ParallaxCore --include='*.java' --include='*.kt' --include='*.aidl' --include='*.xml' --include='*.gradle' --include='*.pro'
          for legacy_dir in \
            ParallaxCore/src/main/java/top/niunaijun \
            ParallaxCore/src/main/java/net_62v \
            ParallaxCore/src/main/java/android/MetaCore \
            ParallaxCore/src/main/java/black \
            ParallaxCore/src/main/aidl/top/niunaijun \
            ParallaxCore/src/main/aidl/android/MetaCore; do
            if [ -d "$legacy_dir" ] && find "$legacy_dir" -type f -print -quit | grep -q .; then
              echo "Legacy source files still present under $legacy_dir"
              find "$legacy_dir" -type f | head -50
              exit 1
            fi
          done

      - name: Build ParallaxCore release AAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ./gradlew :ParallaxCore:assembleRelease --no-daemon --stacktrace 2>&1 | tee parallaxcore-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallaxcore-build-log-${{ github.run_number }}
          path: parallaxcore-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify release AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR='ParallaxCore/build/outputs/aar/ParallaxCore-release.aar'
          test -s "$AAR"
          unzip -tq "$AAR"
          unzip -Z1 "$AAR" | grep -qx 'classes.jar'
          unzip -Z1 "$AAR" | grep -E '^jni/[^/]+/libParallaxCore\.so$'

      - name: Commit verified rebrand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'Fully rebrand SDK internals to ParallaxCore [skip ci]'
          git push origin HEAD:ParallaxCore
