name: Build ParallaxCore

on:
  workflow_dispatch:
  push:
    branches:
      - ParallaxCore
    paths:
      - 'ParallaxCore/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradle/**'
      - '.github/workflows/build-parallax-core.yml'

permissions:
  contents: read

jobs:
  build:
    name: ParallaxCore Release AAR
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout ParallaxCore
        uses: actions/checkout@v4
        with:
          ref: ParallaxCore
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Configure project
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          test -f ParallaxCore/build.gradle
          grep -F "include ':ParallaxCore'" settings.gradle >/dev/null
          grep -F 'rootProject.name = "ParallaxCore"' settings.gradle >/dev/null

      - name: Verify ParallaxCore branding
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          forbidden = re.compile(r'TeamDark|TEAM DARK|TEAMDARK|teamdark|team_dark')
          url_re = re.compile(r'https?://[^\s"\'<>]+')
          bad = []

          for p in Path('ParallaxCore').rglob('*'):
              if not p.is_file() or any(part in {'.gradle', 'build'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              # Existing backend/trust URLs are compatibility contracts and may retain
              # their deployed hostnames. Product/module/source branding may not.
              sanitized = url_re.sub('<COMPAT_URL>', text)
              if forbidden.search(sanitized):
                  bad.append(str(p))

          if bad:
              print('Old TeamDark branding remains outside compatibility URLs:')
              print('\n'.join(bad[:100]))
              raise SystemExit(1)

          print('ParallaxCore branding audit passed')
          PY

      - name: Build ParallaxCore release AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ParallaxCore:assembleRelease --no-daemon --stacktrace

      - name: Verify release AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR='ParallaxCore/build/outputs/aar/ParallaxCore-release.aar'
          test -s "$AAR"
          unzip -tq "$AAR"
          unzip -Z1 "$AAR" | grep -qx 'classes.jar'

          mapfile -t CORE_LIBS < <(unzip -Z1 "$AAR" | grep -E '^jni/[^/]+/libParallaxCore\.so$' | sort)
          printf 'ParallaxCore native libraries:\n'
          printf '  %s\n' "${CORE_LIBS[@]}"
          test "${#CORE_LIBS[@]}" -ge 1

          if unzip -Z1 "$AAR" | grep -Ei 'libTeamDarkCore\.so|TeamDarkCore|TeamDarkSDK'; then
            echo 'Legacy TeamDark native/module branding found in AAR'
            exit 1
          fi

          cp "$AAR" ParallaxCore-release.aar
          sha256sum ParallaxCore-release.aar | tee ParallaxCore-release.aar.sha256

      - name: Upload ParallaxCore AAR
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxCore-release-aar
          path: |
            ParallaxCore-release.aar
            ParallaxCore-release.aar.sha256
          if-no-files-found: error
          retention-days: 30
