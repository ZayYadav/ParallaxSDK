name: Build Parallax Virtual SDK

on:
  workflow_dispatch:
  push:
    branches:
      - PARALLAXvirtual
    paths:
      - 'BLACK-OPNE/**'
      - '.github/workflows/build-parallax-virtual-sdk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Build and test Parallax Virtual SDK
        working-directory: BLACK-OPNE
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :ParallaxCore:testDebugUnitTest :ParallaxCore:assembleRelease --stacktrace --no-daemon

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: Parallax-Virtual-SDK-release
          path: BLACK-OPNE/RIYAZ-VIP/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
