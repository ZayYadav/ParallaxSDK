name: Prepare ParallaxCore SDK

on:
  workflow_dispatch:
  push:
    branches:
      - ParallaxCore
    paths:
      - '.github/workflows/build-teamdark-sdk-aar.yml'

permissions:
  contents: write

jobs:
  migrate:
    name: Rebrand and validate ParallaxCore
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout ParallaxCore
        uses: actions/checkout@v4
        with:
          ref: ParallaxCore
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Isolate and rebrand SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d TeamDarkSDK/BLACK-OPNE/RIYAZ-VIP
          rm -rf /tmp/parallaxcore-sdk
          mkdir -p /tmp/parallaxcore-sdk
          cp -a TeamDarkSDK/BLACK-OPNE/. /tmp/parallaxcore-sdk/
          rm -rf /tmp/parallaxcore-sdk/.gradle
          find /tmp/parallaxcore-sdk -type d -name build -prune -exec rm -rf {} + || true
          rm -f /tmp/parallaxcore-sdk/local.properties
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/parallaxcore-sdk/. .
          mv RIYAZ-VIP ParallaxCore

          python3 <<'PY'
          from pathlib import Path
          import os, re

          root = Path('.')
          path_replacements = [
              ('TeamDarkSDK','ParallaxCore'), ('TeamDarkCore','ParallaxCore'),
              ('TEAMDARK','PARALLAXCORE'), ('TeamDark','ParallaxCore'),
              ('teamdark','parallaxcore'), ('team_dark','parallax_core')
          ]
          def renamed(s):
              for a,b in path_replacements: s=s.replace(a,b)
              return s

          module = root/'ParallaxCore'
          for current, dirs, files in os.walk(module, topdown=False):
              current=Path(current)
              for name in files:
                  nn=renamed(name)
                  if nn!=name: (current/name).rename(current/nn)
              for name in dirs:
                  nn=renamed(name)
                  if nn!=name: (current/name).rename(current/nn)

          replacements = [
              ('com.team.dark','com.parallax.core'), ('com/team/dark','com/parallax/core'),
              ('Team Dark SDK','ParallaxCore SDK'), ('TEAM DARK SDK','PARALLAXCORE SDK'),
              ('TeamDarkSDK','ParallaxCore'), ('TeamDarkCore','ParallaxCore'),
              ('libTeamDarkCore.so','libParallaxCore.so'), ('TEAM DARK','PARALLAX CORE'),
              ('Team Dark','ParallaxCore'), ('TEAMDARK','PARALLAXCORE'),
              ('TeamDark','ParallaxCore'), ('team_dark','parallax_core'),
              ('teamdark','parallaxcore')
          ]
          url_re=re.compile(r'https?://[^\s"\'<>]+')
          def convert(text):
              def apply(chunk):
                  for a,b in replacements: chunk=chunk.replace(a,b)
                  return chunk
              out=[]; pos=0
              for m in url_re.finditer(text):
                  out.append(apply(text[pos:m.start()])); out.append(m.group(0)); pos=m.end()
              out.append(apply(text[pos:])); return ''.join(out)

          for p in root.rglob('*'):
              if not p.is_file() or any(x in {'.git','.github','.gradle','build'} for x in p.parts): continue
              try: text=p.read_bytes().decode('utf-8')
              except Exception: continue
              new=convert(text)
              if new!=text: p.write_text(new,encoding='utf-8')
          PY

          cat > settings.gradle <<'EOF'
          include ':ParallaxCore'
          rootProject.name = "ParallaxCore"
          EOF

          cat > README.md <<'EOF'
          # ParallaxCore

          ParallaxCore is the SDK-only distribution. Loader applications, web panels and unrelated projects are intentionally excluded.

          Build: `./gradlew :ParallaxCore:assembleRelease`

          Release AAR: `ParallaxCore/build/outputs/aar/ParallaxCore-release.aar`

          Existing compatible backend/trust endpoints are preserved where runtime compatibility requires them; SDK/module/class/native branding is ParallaxCore.
          EOF

          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Audit ParallaxCore tree
        shell: bash
        run: |
          set -euo pipefail
          test -d ParallaxCore/src/main
          test -f ParallaxCore/build.gradle
          test ! -e TeamDarkSDK
          python3 <<'PY'
          from pathlib import Path
          import re
          forbidden=re.compile(r'TeamDark|TEAM DARK|TEAMDARK|teamdark|team_dark')
          url_re=re.compile(r'https?://[^\s"\'<>]+')
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in {'.git','.github','.gradle','build'} for x in p.parts): continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              if forbidden.search(url_re.sub('<COMPAT_URL>',text)): bad.append(str(p))
          if bad:
              print('\n'.join(bad[:100])); raise SystemExit(1)
          print('Branding audit passed')
          PY
          grep -F "include ':ParallaxCore'" settings.gradle

      - name: Build ParallaxCore release AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ParallaxCore:assembleRelease --no-daemon --stacktrace

      - name: Verify AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR='ParallaxCore/build/outputs/aar/ParallaxCore-release.aar'
          test -s "$AAR"
          unzip -tq "$AAR"
          unzip -Z1 "$AAR" | grep -qx 'classes.jar'
          sha256sum "$AAR"

      - name: Commit SDK-only source
        shell: bash
        run: |
          set -euo pipefail
          rm -f local.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Rebrand TeamDark SDK as ParallaxCore SDK-only project'
            git push origin HEAD:ParallaxCore
          fi

      - name: Upload validation AAR
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxCore-migration-release-aar
          path: ParallaxCore/build/outputs/aar/ParallaxCore-release.aar
          if-no-files-found: error
          retention-days: 14
