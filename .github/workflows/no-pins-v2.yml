name: No Pins Loader Test V2

on:
  push:
    branches:
      - 'test/loader-no-tls-pins-20260903'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'

      - name: Configure SDK paths
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > BLACK-OPNE/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > One-Core-Engine/local.properties
          chmod +x BLACK-OPNE/gradlew One-Core-Engine/gradlew

      - name: Patch custom TLS pinning out of test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('One-Core-Engine/app/build.gradle')
          s = gradle.read_text()
          p = re.compile(r"def parallaxConfiguredTlsPins = providers\.gradleProperty\('parallaxTlsPins'\).*?def parallaxTlsPins = parallaxTlsPinList\.join\(','\)\n", re.S)
          r = "// NO-PIN TEST BUILD\ndef parallaxBuiltInTlsPins = []\ndef parallaxConfiguredTlsPinList = []\ndef parallaxTlsPinList = []\ndef parallaxTlsPins = ''\n"
          s, n = p.subn(r, s, count=1)
          assert n == 1, 'Gradle pin block not found'
          gradle.write_text(s)

          client = Path('One-Core-Engine/app/src/main/java/com/onecore/loader/security/HostedLicenseClient.java')
          s = client.read_text()
          p = re.compile(r"\s*CertificatePinner\.Builder pins = new CertificatePinner\.Builder\(\);.*?this\.httpClient = new okhttp3\.OkHttpClient\.Builder\(\)\s*\.certificatePinner\(pins\.build\(\)\)", re.S)
          r = "\n        // NO-PIN TEST BUILD: use standard OkHttp/Android CA + hostname validation.\n        this.httpClient = new okhttp3.OkHttpClient.Builder()"
          s, n = p.subn(r, s, count=1)
          assert n == 1, 'CertificatePinner block not found'
          client.write_text(s)

          native = Path('One-Core-Engine/app/src/main/jni/main.cpp')
          s = native.read_text()
          old = "    if (!valid_pins(env, tlsPins)) {\n        result |= GUARD_BAD_PINS;\n    }\n"
          assert old in s, 'native pin guard not found'
          s = s.replace(old, "    // NO-PIN TEST BUILD: empty pin list is allowed.\n", 1)
          native.write_text(s)
          PY

      - name: Verify test patch
        run: |
          ! grep -Fq 'sha256/Ina/GY9COYngSpB7Ht+asGkJ5LV99jpBHYz11jXRSWM=' One-Core-Engine/app/build.gradle
          grep -Fq "def parallaxTlsPins = ''" One-Core-Engine/app/build.gradle
          ! grep -Fq '.certificatePinner(pins.build())' One-Core-Engine/app/src/main/java/com/onecore/loader/security/HostedLicenseClient.java
          echo 'Custom Parallax TLS pinning removed from test workspace.'

      - name: Build SDK release AAR
        working-directory: BLACK-OPNE
        run: ./gradlew :ParallaxCore:assembleRelease --stacktrace

      - name: Replace Loader AAR
        run: |
          cp -f BLACK-OPNE/RIYAZ-VIP/build/outputs/aar/ParallaxCore-release.aar One-Core-Engine/app/libs/ParallaxCore-release.aar

      - name: Prepare release configuration
        working-directory: One-Core-Engine
        env:
          API_KEY_B64: ${{ vars.PARALLAX_API_PUBLIC_KEY_B64 }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$API_KEY_B64" ]; then
            echo "PARALLAX_API_PUBLIC_KEY_B64=$API_KEY_B64" >> "$GITHUB_ENV"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/key.pem >/dev/null 2>&1
            PUB=$(openssl pkey -in /tmp/key.pem -pubout -outform DER 2>/dev/null | base64 -w0)
            echo "PARALLAX_API_PUBLIC_KEY_B64=$PUB" >> "$GITHUB_ENV"
          fi
          STORE_FILE=$(awk -F= '/^storeFile=/{print $2}' signing.properties)
          STORE_PASSWORD=${KS_PASS:-$(awk -F= '/^storePassword=/{print $2}' signing.properties)}
          KEY_ALIAS=${KS_ALIAS:-$(awk -F= '/^keyAlias=/{print $2}' signing.properties)}
          KEY_PASSWORD=${KEY_PASS:-$(awk -F= '/^keyPassword=/{print $2}' signing.properties)}
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            printf '%s' "$KS_B64" | base64 --decode > "$STORE_FILE"
          fi
          if [ ! -f "$STORE_FILE" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            keytool -genkeypair -keystore "$STORE_FILE" -storetype JKS -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=NoPinTest,O=Parallax,C=IN'
            echo 'ONECORE_ALLOWED_SIGNING_SHA256=' >> "$GITHUB_ENV"
          else
            echo 'ONECORE_ALLOWED_SIGNING_SHA256=${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}' >> "$GITHUB_ENV"
          fi
          echo 'PARALLAX_TLS_PINS=' >> "$GITHUB_ENV"

      - name: Build release APK without custom pins
        working-directory: One-Core-Engine
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and stage APK
        run: |
          APK=$(find One-Core-Engine/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          if grep -aFq 'sha256/Ina/GY9COYngSpB7Ht+asGkJ5LV99jpBHYz11jXRSWM=' "$APK"; then
            echo 'Known custom Parallax TLS pin is still present in APK' >&2
            exit 1
          fi
          cp "$APK" OneCoreEdge-no-pins.apk
          sha256sum OneCoreEdge-no-pins.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: OneCoreEdge-no-pins
          path: OneCoreEdge-no-pins.apk
          if-no-files-found: error
