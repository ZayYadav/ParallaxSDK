name: Prepare ParallaxCore SDK

on:
  workflow_dispatch:
  push:
    branches:
      - ParallaxCore
    paths:
      - '.github/workflows/prepare-parallax-core.yml'

permissions:
  contents: write

jobs:
  migrate:
    name: Rebrand and validate ParallaxCore
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout ParallaxCore
        uses: actions/checkout@v4
        with:
          ref: ParallaxCore
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Isolate SDK and rebrand to ParallaxCore
        shell: bash
        run: |
          set -euo pipefail
          test -d TeamDarkSDK/BLACK-OPNE/RIYAZ-VIP

          rm -rf /tmp/parallaxcore-sdk
          mkdir -p /tmp/parallaxcore-sdk
          cp -a TeamDarkSDK/BLACK-OPNE/. /tmp/parallaxcore-sdk/
          rm -rf /tmp/parallaxcore-sdk/.gradle
          find /tmp/parallaxcore-sdk -type d -name build -prune -exec rm -rf {} + || true
          rm -f /tmp/parallaxcore-sdk/local.properties

          # Keep workflow files out of this migration commit; they are finalized separately.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/parallaxcore-sdk/. .

          test -d RIYAZ-VIP
          mv RIYAZ-VIP ParallaxCore

          python3 <<'PY'
          from pathlib import Path
          import os, re

          root = Path('.')
          skip_roots = {'.git', '.github', '.gradle', 'build'}

          path_replacements = [
              ('TeamDarkSDK', 'ParallaxCore'),
              ('TeamDarkCore', 'ParallaxCore'),
              ('TEAMDARK', 'PARALLAXCORE'),
              ('TeamDark', 'ParallaxCore'),
              ('teamdark', 'parallaxcore'),
              ('team_dark', 'parallax_core'),
          ]

          def renamed(name: str) -> str:
              for old, new in path_replacements:
                  name = name.replace(old, new)
              return name

          # Rename branded source paths bottom-up. The module itself is already ParallaxCore.
          module = root / 'ParallaxCore'
          for current, dirs, files in os.walk(module, topdown=False):
              current = Path(current)
              for filename in files:
                  new_name = renamed(filename)
                  if new_name != filename:
                      (current / filename).rename(current / new_name)
              for dirname in dirs:
                  new_name = renamed(dirname)
                  if new_name != dirname:
                      (current / dirname).rename(current / new_name)

          replacements = [
              ('com.team.dark', 'com.parallax.core'),
              ('com/team/dark', 'com/parallax/core'),
              ('Team Dark SDK', 'ParallaxCore SDK'),
              ('TEAM DARK SDK', 'PARALLAXCORE SDK'),
              ('TeamDarkSDK', 'ParallaxCore'),
              ('TeamDarkCore', 'ParallaxCore'),
              ('libTeamDarkCore.so', 'libParallaxCore.so'),
              ('TEAM DARK', 'PARALLAX CORE'),
              ('Team Dark', 'ParallaxCore'),
              ('TEAMDARK', 'PARALLAXCORE'),
              ('TeamDark', 'ParallaxCore'),
              ('team_dark', 'parallax_core'),
              ('teamdark', 'parallaxcore'),
          ]
          url_re = re.compile(r'https?://[^\s"\'<>]+')

          def replace_non_url(text: str) -> str:
              def apply(chunk: str) -> str:
                  for old, new in replacements:
                      chunk = chunk.replace(old, new)
                  return chunk
              out = []
              pos = 0
              for match in url_re.finditer(text):
                  out.append(apply(text[pos:match.start()]))
                  out.append(match.group(0))
                  pos = match.end()
              out.append(apply(text[pos:]))
              return ''.join(out)

          candidates = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              parts = set(p.parts)
              if parts & skip_roots:
                  continue
              candidates.append(p)

          changed = 0
          for p in candidates:
              try:
                  raw = p.read_bytes()
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = replace_non_url(text)
              if updated != text:
                  p.write_text(updated, encoding='utf-8', newline='')
                  changed += 1

          print(f'Rebranded {changed} UTF-8 source/config files')
          PY

          cat > settings.gradle <<'EOF'
          include ':ParallaxCore'
          rootProject.name = "ParallaxCore"
          EOF

          cat > README.md <<'EOF'
          # ParallaxCore

          ParallaxCore is the SDK-only distribution of this branch. Loader applications, web panels,
          deployment projects and unrelated products are intentionally excluded.

          ## Build

          ```bash
          ./gradlew :ParallaxCore:assembleRelease
          ```

          Release AAR: `ParallaxCore/build/outputs/aar/ParallaxCore-release.aar`

          The SDK keeps its existing compatible backend/trust endpoints where required for runtime
          compatibility; product/module/class/native branding in this branch is ParallaxCore.
          EOF

          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Audit SDK-only tree and branding
        shell: bash
        run: |
          set -euo pipefail
          test -d ParallaxCore/src/main
          test -f ParallaxCore/build.gradle
          test ! -e TeamDarkSDK
          test ! -e panels
          test ! -e sdk-panel

          python3 <<'PY'
          from pathlib import Path
          import re

          forbidden = re.compile(r'TeamDark|TEAM DARK|TEAMDARK|teamdark|team_dark')
          url_re = re.compile(r'https?://[^\s"\'<>]+')
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in {'.git','.github','.gradle','build'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              sanitized = url_re.sub('<COMPAT_URL>', text)
              if forbidden.search(sanitized):
                  bad.append(str(p))
          if bad:
              print('Old branding remains outside preserved compatibility URLs:')
              print('\n'.join(bad[:100]))
              raise SystemExit(1)
          print('ParallaxCore branding audit passed')
          PY

          grep -F "include ':ParallaxCore'" settings.gradle
          grep -F 'rootProject.name = "ParallaxCore"' settings.gradle

      - name: Build ParallaxCore release AAR
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ParallaxCore:assembleRelease --no-daemon --stacktrace

      - name: Verify AAR
        shell: bash
        run: |
          set -euo pipefail
          AAR="ParallaxCore/build/outputs/aar/ParallaxCore-release.aar"
          test -s "$AAR"
          unzip -tq "$AAR"
          unzip -Z1 "$AAR" | grep -qx 'classes.jar'
          cp "$AAR" ParallaxCore-release.aar
          sha256sum ParallaxCore-release.aar

      - name: Commit SDK-only migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f local.properties ParallaxCore-release.aar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Rebrand TeamDark SDK as ParallaxCore SDK-only project'
            git push origin HEAD:ParallaxCore
          fi

      - name: Upload validation AAR
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxCore-migration-release-aar
          path: ParallaxCore/build/outputs/aar/ParallaxCore-release.aar
          if-no-files-found: error
          retention-days: 14
