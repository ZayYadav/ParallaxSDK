name: Build Loader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "BLACK-OPNE/**"
      - "One-Core-Engine/**"
      - "backend-api/**"
      - ".github/workflows/build-loader-apk.yml"
  pull_request:
    paths:
      - "BLACK-OPNE/**"
      - "One-Core-Engine/**"
      - "backend-api/**"
      - ".github/workflows/build-loader-apk.yml"

jobs:
  backend:
    name: Validate PHP integrity backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: onecore_ci_root
          MYSQL_DATABASE: onecore_integrity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ponecore_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify PHP and Composer
        run: |
          php --version
          composer --version
          php -m | grep -E 'curl|json|openssl|PDO|pdo_mysql'

      - name: Validate Composer and install locked dependencies
        run: |
          composer validate --strict
          composer install --no-dev --optimize-autoloader --no-interaction
          composer audit --no-dev

      - name: Lint PHP sources
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test crypto, JWT, and request binding
        run: php tests/run.php

      - name: Test account roles, referrals, balances, and key ownership
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: onecore_integrity
          TEST_DB_USER: root
          TEST_DB_PASSWORD: onecore_ci_root
        run: |
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root onecore_integrity < install.sql
          php tests/account_integration.php

      - name: Package deployable PHP backend
        run: |
          zip -r ../onecore-integrity-backend.zip . \
            -x 'tests/*' 'config.local.php' 'runtime/*' '.gitignore'

      - name: Upload deployable PHP backend
        uses: actions/upload-artifact@v6
        with:
          name: onecore-integrity-backend
          path: onecore-integrity-backend.zip
          if-no-files-found: error

  build:
    name: Build SDK AAR and Loader APK
    runs-on: ubuntu-latest

    env:
      SDK_PROJECT_DIR: BLACK-OPNE
      SDK_MODULE: ParallaxCore
      SDK_MODULE_DIR: RIYAZ-VIP
      LOADER_PROJECT_DIR: One-Core-Engine
      LOADER_AAR_PATH: One-Core-Engine/app/libs/ParallaxCore-release.aar
      NDK_VERSION: 27.2.12479018
      BUILD_LOG_DIR: build-logs
      ONECORE_API_BASE_URL: https://onintigirty.parallaxserver.online
      ONECORE_API_ENCRYPTION_KEY: ${{ secrets.ONECORE_API_ENCRYPTION_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ONECORE_ALLOWED_SIGNING_SHA256: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Configure local Android SDK paths
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${LOADER_PROJECT_DIR}/local.properties"

      - name: Make Gradle wrappers executable
        run: |
          chmod +x "${SDK_PROJECT_DIR}/gradlew"
          chmod +x "${LOADER_PROJECT_DIR}/gradlew"

      - name: Prepare build log folder
        run: mkdir -p "${BUILD_LOG_DIR}"

      - name: Validate loader licensing configuration
        shell: python
        run: |
          import base64
          import os
          from urllib.parse import urlparse

          base_url = os.environ.get("ONECORE_API_BASE_URL", "").strip()
          parsed = urlparse(base_url)
          if parsed.scheme != "https" or not parsed.netloc or parsed.query or parsed.fragment:
              raise SystemExit("ONECORE_API_BASE_URL must be an absolute HTTPS URL")

          encoded_key = os.environ.get("ONECORE_API_ENCRYPTION_KEY", "").strip()
          try:
              decoded_key = base64.b64decode(encoded_key, validate=True)
          except Exception as exc:
              raise SystemExit("ONECORE_API_ENCRYPTION_KEY is not valid base64") from exc
          if len(decoded_key) != 32:
              raise SystemExit("ONECORE_API_ENCRYPTION_KEY must decode to exactly 32 bytes")

          print("Loader licensing configuration is valid")

      - name: Build SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :${{ env.SDK_MODULE }}:assembleRelease --stacktrace 2>&1 | tee "../${BUILD_LOG_DIR}/sdk-release-aar.log"

      - name: Replace loader ParallaxCore AAR with freshly built SDK AAR
        run: |
          set -euo pipefail
          SDK_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -f "$SDK_AAR"
          mkdir -p "$(dirname "${LOADER_AAR_PATH}")"
          rm -f "${LOADER_AAR_PATH}"
          cp "$SDK_AAR" "${LOADER_AAR_PATH}"
          ls -lh "$SDK_AAR" "${LOADER_AAR_PATH}"

      - name: Create fallback signing keystore if missing
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -euo pipefail
          STORE_FILE=$(awk -F= '/^storeFile=/{print $2}' signing.properties)
          STORE_PASSWORD=${STORE_PASSWORD:-$(awk -F= '/^storePassword=/{print $2}' signing.properties)}
          KEY_ALIAS=${KEY_ALIAS:-$(awk -F= '/^keyAlias=/{print $2}' signing.properties)}
          KEY_PASSWORD=${KEY_PASSWORD:-$(awk -F= '/^keyPassword=/{print $2}' signing.properties)}
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          fi
          if [ ! -f "$STORE_FILE" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            keytool -genkeypair \
              -keystore "$STORE_FILE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CI,O=SdkLodaLasan,C=US"
          fi

      - name: Build signed loader release and debug APKs
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace 2>&1 | tee "../${BUILD_LOG_DIR}/loader-apks.log"

      - name: Record release signing certificate SHA-256
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$RELEASE_APK" \
            | tee "${BUILD_LOG_DIR}/loader-signing-certificate.txt"

      - name: Upload SDK AAR
        uses: actions/upload-artifact@v6
        with:
          name: sdk-release-aar
          path: ${{ env.SDK_PROJECT_DIR }}/${{ env.SDK_MODULE_DIR }}/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload loader release APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-release-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload loader debug APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-debug-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release signing certificate
        uses: actions/upload-artifact@v6
        with:
          name: loader-signing-certificate
          path: ${{ env.BUILD_LOG_DIR }}/loader-signing-certificate.txt
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: ${{ env.BUILD_LOG_DIR }}/*.log
          if-no-files-found: warn
