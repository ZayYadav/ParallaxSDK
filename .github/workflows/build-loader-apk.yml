name: Build Loader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - KESHAVXOWNER
    paths:
      - "BLACK-OPNE/**"
      - "One-Core-Engine/**"
      - "backend-api/**"
      - "panels/key-panel/**"
      - ".github/workflows/build-loader-apk.yml"
  pull_request:
    paths:
      - "BLACK-OPNE/**"
      - "One-Core-Engine/**"
      - "backend-api/**"
      - "panels/key-panel/**"
      - ".github/workflows/build-loader-apk.yml"

jobs:
  backend:
    name: Validate PHP integrity backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: onecore_ci_root
          MYSQL_DATABASE: onecore_integrity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ponecore_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify PHP and Composer
        run: |
          php --version
          composer --version
          php -m | grep -E 'curl|json|openssl|PDO|pdo_mysql'

      - name: Validate Composer and install locked dependencies
        run: |
          composer validate --strict
          composer install --no-dev --optimize-autoloader --no-interaction
          composer audit --no-dev

      - name: Lint PHP sources
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          find ../panels/key-panel -name '*.php' -print0 | xargs -0 -n1 php -l
          find ../panels/sdk-panel -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test standalone key panel
        run: php ../panels/key-panel/tests/run.php

      - name: Test standalone key panel with MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: keshavxowner_panel_ci
          DB_USER: root
          DB_PASSWORD: onecore_ci_root
        run: |
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root -e 'CREATE DATABASE keshavxowner_panel_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php ../panels/key-panel/tests/integration.php

      - name: Test fresh SDK panel schema with MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root -e 'CREATE DATABASE keshavxowner_sdk_panel_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci < ../panels/sdk-panel/database/fresh-install.sql
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci -e \
            "SELECT username,password,role,status,is_online FROM users LIMIT 0; SELECT license_key,expiry_date,status,package_name FROM licenses LIMIT 0; SELECT setting_key,setting_value FROM panel_settings LIMIT 1; SELECT setting_key,setting_value,broadcast_version FROM server_settings LIMIT 1;"
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci -e \
            "ALTER TABLE server_settings DROP COLUMN broadcast_version;"
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci < ../panels/sdk-panel/database/fresh-install.sql
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci -e \
            "SELECT broadcast_version FROM server_settings LIMIT 1;"
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci < ../panels/sdk-panel/secure_api_migration.sql
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root keshavxowner_sdk_panel_ci < ../panels/sdk-panel/secure_api_migration.sql

      - name: Test crypto, JWT, and request binding
        run: php tests/run.php

      - name: Test account roles, referrals, balances, and key ownership
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_NAME: onecore_integrity
          TEST_DB_USER: root
          TEST_DB_PASSWORD: onecore_ci_root
        run: |
          mysql -h 127.0.0.1 -uroot -ponecore_ci_root onecore_integrity < install.sql
          php tests/account_integration.php

      - name: Package deployable PHP backend
        run: |
          zip -r ../onecore-integrity-backend.zip . \
            -x 'tests/*' 'config.local.php' 'runtime/*' '.gitignore'

      - name: Upload deployable PHP backend
        uses: actions/upload-artifact@v6
        with:
          name: onecore-integrity-backend
          path: onecore-integrity-backend.zip
          if-no-files-found: error

      - name: Package standalone key panel
        working-directory: panels/key-panel
        run: |
          zip -r ../../keshavxowner-standalone-key-panel.zip . \
            -x '.env' 'runtime/*' 'tests/*' '.gitignore'

      - name: Upload standalone key panel
        uses: actions/upload-artifact@v6
        with:
          name: keshavxowner-standalone-key-panel
          path: keshavxowner-standalone-key-panel.zip
          if-no-files-found: error

  build:
    name: Build SDK AAR and Loader APK
    runs-on: ubuntu-latest

    env:
      SDK_PROJECT_DIR: BLACK-OPNE
      SDK_MODULE: KESHAVXOWNERCore
      SDK_MODULE_DIR: RIYAZ-VIP
      LOADER_PROJECT_DIR: One-Core-Engine
      LOADER_AAR_PATH: One-Core-Engine/app/libs/KESHAVXOWNERCore-release.aar
      NDK_VERSION: 27.2.12479018
      BUILD_LOG_DIR: build-logs
      KESHAVXOWNER_API_PUBLIC_KEY_B64: ${{ vars.KESHAVXOWNER_API_PUBLIC_KEY_B64 }}
      KESHAVXOWNER_TLS_PINS: ${{ vars.KESHAVXOWNER_TLS_PINS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ONECORE_ALLOWED_SIGNING_SHA256: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Configure local Android SDK paths
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${LOADER_PROJECT_DIR}/local.properties"

      - name: Make Gradle wrappers executable
        run: |
          chmod +x "${SDK_PROJECT_DIR}/gradlew"
          chmod +x "${LOADER_PROJECT_DIR}/gradlew"

      - name: Prepare build log folder
        run: mkdir -p "${BUILD_LOG_DIR}"

      - name: Configure encrypted loader transport
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KESHAVXOWNER_API_PUBLIC_KEY_B64:-}" ] && [ -n "${KESHAVXOWNER_TLS_PINS:-}" ]; then
            echo "KESHAVXOWNER_HAS_RELEASE_TRANSPORT=true" >> "$GITHUB_ENV"
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/keshavxowner-ci-private.pem 2>/dev/null
            PUBLIC_KEY=$(openssl pkey -in /tmp/keshavxowner-ci-private.pem -pubout -outform DER 2>/dev/null | base64 -w0)
            rm -f /tmp/keshavxowner-ci-private.pem
            echo "KESHAVXOWNER_API_PUBLIC_KEY_B64=${PUBLIC_KEY}" >> "$GITHUB_ENV"
            echo "KESHAVXOWNER_TLS_PINS=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" >> "$GITHUB_ENV"
            echo "KESHAVXOWNER_HAS_RELEASE_TRANSPORT=false" >> "$GITHUB_ENV"
            echo "WARNING: using non-production transport configuration for this CI build."
          fi
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${STORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "KESHAVXOWNER_HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "KESHAVXOWNER_HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
            echo "WARNING: using the throwaway CI signing certificate for this build."
          fi
          if [ -n "${KESHAVXOWNER_API_PUBLIC_KEY_B64:-}" ] \
            && [ -n "${KESHAVXOWNER_TLS_PINS:-}" ] \
            && [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${STORE_PASSWORD:-}" ] \
            && [ -n "${KEY_ALIAS:-}" ] \
            && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "KESHAVXOWNER_ARTIFACT_TIER=production" >> "$GITHUB_ENV"
          else
            echo "KESHAVXOWNER_ARTIFACT_TIER=ci-nonproduction" >> "$GITHUB_ENV"
          fi

      - name: Validate encrypted loader transport
        shell: python
        run: |
          import base64
          import os
          import re

          try:
              public_key = base64.b64decode(
                  os.environ.get("KESHAVXOWNER_API_PUBLIC_KEY_B64", ""), validate=True
              )
          except Exception as error:
              raise SystemExit("KESHAVXOWNER_API_PUBLIC_KEY_B64 is invalid") from error
          if len(public_key) < 256 or len(public_key) > 1024:
              raise SystemExit("KESHAVXOWNER_API_PUBLIC_KEY_B64 has an invalid DER size")
          pins = [item.strip() for item in os.environ.get("KESHAVXOWNER_TLS_PINS", "").split(",") if item.strip()]
          if not pins or any(not re.fullmatch(r"sha256/[A-Za-z0-9+/]{43}=", item) for item in pins):
              raise SystemExit("KESHAVXOWNER_TLS_PINS must contain valid OkHttp SHA-256 pins")
          print("Encrypted and pinned KESHAVXOWNER transport configuration is valid")

      - name: Build SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :${{ env.SDK_MODULE }}:assembleRelease --stacktrace 2>&1 | tee "../${BUILD_LOG_DIR}/sdk-release-aar.log"

      - name: Replace loader KESHAVXOWNERCore AAR with freshly built SDK AAR
        run: |
          set -euo pipefail
          SDK_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -f "$SDK_AAR"
          mkdir -p "$(dirname "${LOADER_AAR_PATH}")"
          rm -f "${LOADER_AAR_PATH}"
          cp "$SDK_AAR" "${LOADER_AAR_PATH}"
          ls -lh "$SDK_AAR" "${LOADER_AAR_PATH}"

      - name: Create fallback signing keystore if missing
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -euo pipefail
          STORE_FILE=$(awk -F= '/^storeFile=/{print $2}' signing.properties)
          STORE_PASSWORD=${STORE_PASSWORD:-$(awk -F= '/^storePassword=/{print $2}' signing.properties)}
          KEY_ALIAS=${KEY_ALIAS:-$(awk -F= '/^keyAlias=/{print $2}' signing.properties)}
          KEY_PASSWORD=${KEY_PASSWORD:-$(awk -F= '/^keyPassword=/{print $2}' signing.properties)}
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          fi
          if [ ! -f "$STORE_FILE" ]; then
            mkdir -p "$(dirname "$STORE_FILE")"
            keytool -genkeypair \
              -keystore "$STORE_FILE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CI,O=SdkLodaLasan,C=US"
          fi

      - name: Build signed loader release APK
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            --no-daemon --stacktrace 2>&1 | tee "../${BUILD_LOG_DIR}/loader-release-apk.log"

      - name: Verify release APK and packaged DEX
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          DEX_DIR=$(mktemp -d)
          unzip -qq "$RELEASE_APK" 'classes*.dex' -d "$DEX_DIR"
          DEX_COUNT=0
          for dex in "$DEX_DIR"/classes*.dex; do
            "${ANDROID_HOME}/build-tools/36.0.0/dexdump" -f "$dex" >/dev/null
            DEX_COUNT=$((DEX_COUNT + 1))
          done
          test "$DEX_COUNT" -gt 0
          for plaintext in \
            'https://keshavxownerloader.keshavxownerserver.online/api/v2/connect' \
            'keshavxowner-license-v2-request' \
            'keshavxowner-license-v2-response:' \
            'Licensing TLS pins are not configured' \
            'accounts.google.com' \
            'www.facebook.com' \
            'oauth.x.com' \
            'IGmsServiceBroker'; do
            if grep -aF -- "$plaintext" "$DEX_DIR"/classes*.dex; then
              echo "Sensitive plaintext remains in release DEX: $plaintext" >&2
              exit 1
            fi
          done
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$RELEASE_APK" >/dev/null
          printf 'lsparanoid=enabled\nr8_minify=enabled\nresource_shrinking=enabled\ndex_files=%s\n' "$DEX_COUNT" \
            | tee "${BUILD_LOG_DIR}/loader-stability-report.txt"

      - name: Build loader debug APK
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug \
            --no-daemon --stacktrace 2>&1 | tee "../${BUILD_LOG_DIR}/loader-debug-apk.log"

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          test -n "$DEBUG_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$DEBUG_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$DEBUG_APK" >/dev/null

      - name: Record release signing certificate SHA-256
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -name '*.apk' -print -quit)
          test -n "$RELEASE_APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$RELEASE_APK" \
            | tee "${BUILD_LOG_DIR}/loader-signing-certificate.txt"

      - name: Record APK artifact information
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -name '*.apk' -print -quit)
          DEBUG_APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/debug" -name '*.apk' -print -quit)
          {
            printf 'artifact_tier=%s\n' "${KESHAVXOWNER_ARTIFACT_TIER}"
            printf 'production_transport=%s\n' "${KESHAVXOWNER_HAS_RELEASE_TRANSPORT}"
            printf 'production_signing=%s\n' "${KESHAVXOWNER_HAS_RELEASE_SIGNING}"
            printf 'loader_obfuscation=r8+lsparanoid\n'
            printf 'commit=%s\n' "${GITHUB_SHA}"
            if [ "${KESHAVXOWNER_ARTIFACT_TIER}" != 'production' ]; then
              printf 'warning=CI verification build only; configure production transport and signing before distribution.\n'
            fi
            sha256sum "$RELEASE_APK" "$DEBUG_APK"
          } | tee "${BUILD_LOG_DIR}/apk-artifact-info.txt"

      - name: Upload SDK AAR
        uses: actions/upload-artifact@v6
        with:
          name: sdk-release-aar
          path: ${{ env.SDK_PROJECT_DIR }}/${{ env.SDK_MODULE_DIR }}/build/outputs/aar/*-release.aar
          if-no-files-found: error

      - name: Upload loader release APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-${{ env.KESHAVXOWNER_ARTIFACT_TIER }}-release-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload loader debug APK
        uses: actions/upload-artifact@v6
        with:
          name: loader-${{ env.KESHAVXOWNER_ARTIFACT_TIER }}-debug-apk
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release signing certificate
        uses: actions/upload-artifact@v6
        with:
          name: loader-signing-certificate
          path: ${{ env.BUILD_LOG_DIR }}/loader-signing-certificate.txt
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            ${{ env.BUILD_LOG_DIR }}/*.log
            ${{ env.BUILD_LOG_DIR }}/loader-stability-report.txt
            ${{ env.BUILD_LOG_DIR }}/apk-artifact-info.txt
          if-no-files-found: warn
