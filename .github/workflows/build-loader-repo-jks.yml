name: Build Loader With Repository JKS

on:
  workflow_dispatch:
  push:
    branches:
      - ParallaxLoaderServerDonwnLoad
    paths:
      - ".github/workflows/build-loader-repo-jks.yml"
      - "One-Core-Engine/**"
      - "BLACK-OPNE/**"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify repository-signed Loader
    runs-on: ubuntu-latest

    env:
      SDK_PROJECT_DIR: BLACK-OPNE
      SDK_MODULE: ParallaxCore
      SDK_MODULE_DIR: RIYAZ-VIP
      LOADER_PROJECT_DIR: One-Core-Engine
      LOADER_AAR_PATH: One-Core-Engine/app/libs/ParallaxCore-release.aar
      NDK_VERSION: 27.2.12479018
      EXPECTED_SIGNER_SHA256: 799B5FB404DA098E3A185720FE237DC477733427C165C1CDC919EE6F6A01F490
      BUILD_LOG_DIR: repo-jks-build-logs
      PARALLAX_API_PUBLIC_KEY_B64: ${{ vars.PARALLAX_API_PUBLIC_KEY_B64 }}
      PARALLAX_TLS_PINS: ${{ vars.PARALLAX_TLS_PINS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android SDK paths
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${LOADER_PROJECT_DIR}/local.properties"
          chmod +x "${SDK_PROJECT_DIR}/gradlew" "${LOADER_PROJECT_DIR}/gradlew"
          mkdir -p "${BUILD_LOG_DIR}"

      - name: Validate repository signing files
        shell: bash
        run: |
          set -euo pipefail
          test -s "${LOADER_PROJECT_DIR}/app/ParallaxLoader-release.jks"
          test -s "${LOADER_PROJECT_DIR}/signing.properties"
          grep -q '^storeFile=app/ParallaxLoader-release.jks$' "${LOADER_PROJECT_DIR}/signing.properties"
          grep -q '^keyAlias=ParallaxLoaderRelease$' "${LOADER_PROJECT_DIR}/signing.properties"
          if ! grep -Eq '^(storePassword|keyPass)=.+' "${LOADER_PROJECT_DIR}/signing.properties"; then
            echo "Signing properties has no store password value." >&2
            exit 1
          fi
          if ! grep -Eq '^(keyPassword|keyPass)=.+' "${LOADER_PROJECT_DIR}/signing.properties"; then
            echo "Signing properties has no key password value." >&2
            exit 1
          fi
          echo "Repository signing configuration is present."

      - name: Validate encrypted transport configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PARALLAX_API_PUBLIC_KEY_B64:-}"
          test -n "${PARALLAX_TLS_PINS:-}"

      - name: Build fresh SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :${SDK_MODULE}:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "../${BUILD_LOG_DIR}/sdk-release-aar.log"

      - name: Replace Loader AAR with fresh SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -s "$SDK_AAR"
          cp "$SDK_AAR" "${LOADER_AAR_PATH}"
          sha256sum "$SDK_AAR" "${LOADER_AAR_PATH}" | tee "${BUILD_LOG_DIR}/sdk-aar.sha256"

      - name: Build release APK with repository JKS
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "../${BUILD_LOG_DIR}/loader-release-apk.log"

      - name: Verify exact release signer
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          CERT_OUTPUT=$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT" | tee "${BUILD_LOG_DIR}/loader-signing-certificate.txt"
          ACTUAL=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "${EXPECTED_SIGNER_SHA256}" ]; then
            echo "Wrong signing certificate. Expected repository ParallaxLoader key." >&2
            exit 1
          fi
          printf 'EXPECTED_ANDROID_PACKAGE=com.onecore.loader\n' > "${BUILD_LOG_DIR}/panel-signing-config.env"
          printf 'EXPECTED_ANDROID_CERT_SHA256=%s\n' "$ACTUAL" >> "${BUILD_LOG_DIR}/panel-signing-config.env"
          printf 'MIN_ANDROID_VERSION_CODE=2\n' >> "${BUILD_LOG_DIR}/panel-signing-config.env"
          sha256sum "$APK" | tee "${BUILD_LOG_DIR}/release-apk.sha256"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/dev/null

      - name: Upload repository-JKS release APK
        uses: actions/upload-artifact@v6
        with:
          name: parallax-loader-repository-jks-release
          path: ${{ env.LOADER_PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signer and panel configuration
        uses: actions/upload-artifact@v6
        with:
          name: parallax-loader-repository-jks-signing-info
          path: |
            ${{ env.BUILD_LOG_DIR }}/loader-signing-certificate.txt
            ${{ env.BUILD_LOG_DIR }}/panel-signing-config.env
            ${{ env.BUILD_LOG_DIR }}/release-apk.sha256
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parallax-loader-repository-jks-build-logs
          path: ${{ env.BUILD_LOG_DIR }}/
          if-no-files-found: warn
