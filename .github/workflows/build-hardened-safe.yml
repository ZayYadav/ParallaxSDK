name: Build original UI Loader and DPT protect

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'BLACK-OPNE/**'
      - 'One-Core-Engine/**'
      - '.github/workflows/build-hardened-safe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'BLACK-OPNE/**'
      - 'One-Core-Engine/**'
      - '.github/workflows/build-hardened-safe.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-release:
    name: Build original UI release APK
    runs-on: ubuntu-latest
    env:
      SDK_PROJECT_DIR: BLACK-OPNE
      SDK_MODULE: KESHAVXOWNERCore
      SDK_MODULE_DIR: RIYAZ-VIP
      LOADER_PROJECT_DIR: One-Core-Engine
      LOADER_AAR_PATH: One-Core-Engine/app/libs/KESHAVXOWNERCore-release.aar
      NDK_VERSION: 27.2.12479018
      KESHAVXOWNER_API_PUBLIC_KEY_B64: ${{ vars.KESHAVXOWNER_API_PUBLIC_KEY_B64 }}
      KESHAVXOWNER_TLS_PINS: ${{ vars.KESHAVXOWNER_TLS_PINS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ONECORE_ALLOWED_SIGNING_SHA256: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${NDK_VERSION}"

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${SDK_PROJECT_DIR}/local.properties"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "${LOADER_PROJECT_DIR}/local.properties"
          chmod +x "${SDK_PROJECT_DIR}/gradlew" "${LOADER_PROJECT_DIR}/gradlew"

      - name: Validate production transport trust
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KESHAVXOWNER_API_PUBLIC_KEY_B64:-}" ] || [ -z "${KESHAVXOWNER_TLS_PINS:-}" ]; then
            echo 'Production KESHAVXOWNER_API_PUBLIC_KEY_B64 and KESHAVXOWNER_TLS_PINS are required.' >&2
            exit 1
          fi

      - name: Build SDK release AAR
        working-directory: ${{ env.SDK_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :${SDK_MODULE}:assembleRelease --no-daemon --stacktrace

      - name: Replace Loader AAR with fresh SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_AAR="${SDK_PROJECT_DIR}/${SDK_MODULE_DIR}/build/outputs/aar/${SDK_MODULE}-release.aar"
          test -f "$SDK_AAR"
          mkdir -p "$(dirname "$LOADER_AAR_PATH")"
          cp "$SDK_AAR" "$LOADER_AAR_PATH"

      - name: Restore original signing keystore
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo 'Production signing secrets are required for the DPT protected release workflow.' >&2
            exit 1
          fi
          STORE_FILE=$(awk -F= '/^storeFile=/{print $2}' signing.properties)
          mkdir -p "$(dirname "$STORE_FILE")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          test -s "$STORE_FILE"

      - name: Build original release APK
        working-directory: ${{ env.LOADER_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify original release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${LOADER_PROJECT_DIR}/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/dev/null
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p release-artifact
          cp "$APK" release-artifact/app-release.apk
          {
            echo 'variant=release'
            echo 'ui=original-main'
            echo 'permissions=original-main-manifest'
            echo 'r8_minify=disabled'
            echo 'resource_shrinking=disabled'
            echo 'dpt_protection=pending-next-job'
            sha256sum release-artifact/app-release.apk
          } > release-artifact/RELEASE_INFO.txt

      - name: Upload original release source APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loader-original-release-apk
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30

  dpt-protect-release:
    name: DPT protect original UI and restore original signer
    needs: build-release
    uses: ZayYadav/KESHAVXOWNERDPT/.github/workflows/protect-apk.yml@7d72080525c22f2987cd46636730ee42a2056054
    with:
      source_artifact: loader-original-release-apk
      output_artifact: loader-original-ui-dpt-protected-apk
      dpt_ref: 7d72080525c22f2987cd46636730ee42a2056054
      smaller: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
