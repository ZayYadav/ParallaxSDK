name: ELiteLoaderBuild

on:
  workflow_dispatch:
  push:
    branches:
      - ParallaxELiteLoader
    paths:
      - 'One-Core-Engine/**'
      - '.github/workflows/ELiteLoaderBuild.yml'

permissions:
  contents: read

concurrency:
  group: elite-loader-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ParallaxELite Loader APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ELITE_SDK_DIR: .elite-sdk
      ELITE_SDK_REF: e9ab3c37c1bb12d50a0ac1b4dc8b755d1a681601
      LOADER_DIR: One-Core-Engine
      LOADER_AAR: One-Core-Engine/app/libs/ParallaxELite-release.aar
      ANDROID_API: '36'
      BUILD_TOOLS: '36.0.0'
      NDK_VERSION: '27.2.12479018'
      GRADLE_VERSION: '8.13'
      BUILD_LOG_DIR: elite-loader-build-logs
      PARALLAX_API_PUBLIC_KEY_B64: ${{ vars.PARALLAX_API_PUBLIC_KEY_B64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ONECORE_ALLOWED_SIGNING_SHA256_SECRET: ${{ secrets.ONECORE_ALLOWED_SIGNING_SHA256 }}

    steps:
      - name: Checkout ParallaxSDK loader branch
        uses: actions/checkout@v4

      - name: Checkout pinned ParallaxELite SDK
        uses: actions/checkout@v4
        with:
          repository: ZayYadav/ParallaxElite
          ref: ${{ env.ELITE_SDK_REF }}
          path: ${{ env.ELITE_SDK_DIR }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android platform build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > "${ELITE_SDK_DIR}/local.properties"
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > "${LOADER_DIR}/local.properties"
          chmod +x "${LOADER_DIR}/gradlew"
          mkdir -p "${BUILD_LOG_DIR}"

      - name: Build pinned ParallaxELite release AAR
        shell: bash
        run: |
          set -o pipefail
          gradle -p "${ELITE_SDK_DIR}" clean assembleRelease \
            --no-daemon --stacktrace \
            2>&1 | tee "${BUILD_LOG_DIR}/parallaxelite-aar.log"

      - name: Verify and install ParallaxELite AAR into OneCore
        shell: bash
        run: |
          set -euo pipefail
          SDK_AAR=$(find "${ELITE_SDK_DIR}/build/outputs/aar" \
            -maxdepth 1 -type f -name '*-release.aar' -print -quit)
          test -n "${SDK_AAR}"
          unzip -tq "${SDK_AAR}"

          VERIFY_DIR=$(mktemp -d)
          unzip -q "${SDK_AAR}" -d "${VERIFY_DIR}"
          test -f "${VERIFY_DIR}/classes.jar"
          test -f "${VERIFY_DIR}/jni/arm64-v8a/libParallaxELiteCore.so"
          test -f "${VERIFY_DIR}/jni/armeabi-v7a/libParallaxELiteCore.so"
          jar tf "${VERIFY_DIR}/classes.jar" | grep -qx 'com/parallax/ELite.class'

          mkdir -p "$(dirname "${LOADER_AAR}")"
          rm -f "${LOADER_DIR}/app/libs/"*.aar
          cp "${SDK_AAR}" "${LOADER_AAR}"
          sha256sum "${LOADER_AAR}" | tee "${BUILD_LOG_DIR}/parallaxelite-aar.sha256"

      - name: Configure Loader transport
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PARALLAX_API_PUBLIC_KEY_B64:-}" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out /tmp/elite-loader-ci-private.pem 2>/dev/null
            PUBLIC_KEY=$(openssl pkey \
              -in /tmp/elite-loader-ci-private.pem \
              -pubout -outform DER 2>/dev/null | base64 -w0)
            rm -f /tmp/elite-loader-ci-private.pem
            echo "PARALLAX_API_PUBLIC_KEY_B64=${PUBLIC_KEY}" >> "${GITHUB_ENV}"
            echo "ELITE_LOADER_TRANSPORT=ci-fallback" >> "${GITHUB_ENV}"
          else
            echo "ELITE_LOADER_TRANSPORT=configured" >> "${GITHUB_ENV}"
          fi

      - name: Configure Loader signing
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE_REL='keys/elite-loader.jks'

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] \
            && [ -n "${STORE_PASSWORD_SECRET:-}" ] \
            && [ -n "${KEY_ALIAS_SECRET:-}" ] \
            && [ -n "${KEY_PASSWORD_SECRET:-}" ]; then
            STORE_PASSWORD="${STORE_PASSWORD_SECRET}"
            KEY_ALIAS="${KEY_ALIAS_SECRET}"
            KEY_PASSWORD="${KEY_PASSWORD_SECRET}"
            mkdir -p "${LOADER_DIR}/keys"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode \
              > "${LOADER_DIR}/${STORE_FILE_REL}"
            ONECORE_ALLOWED_SIGNING_SHA256="${ONECORE_ALLOWED_SIGNING_SHA256_SECRET:-}"
            echo "ELITE_LOADER_SIGNING=configured" >> "${GITHUB_ENV}"
          else
            STORE_PASSWORD='11111111'
            KEY_ALIAS='key0'
            KEY_PASSWORD='11111111'
            mkdir -p "${LOADER_DIR}/keys"
            keytool -genkeypair \
              -keystore "${LOADER_DIR}/${STORE_FILE_REL}" \
              -storetype JKS \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=ParallaxELiteLoader CI,O=Parallax,C=IN'
            ONECORE_ALLOWED_SIGNING_SHA256=''
            echo "ELITE_LOADER_SIGNING=ci-fallback" >> "${GITHUB_ENV}"
          fi

          {
            echo "STORE_FILE=${STORE_FILE_REL}"
            echo "STORE_PASSWORD=${STORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
            echo "ONECORE_ALLOWED_SIGNING_SHA256=${ONECORE_ALLOWED_SIGNING_SHA256}"
          } >> "${GITHUB_ENV}"

      - name: Build ParallaxELiteLoader release APK
        working-directory: ${{ env.LOADER_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee "../${BUILD_LOG_DIR}/elite-loader-release.log"

      - name: Verify ParallaxELite engine inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${LOADER_DIR}/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)
          test -n "${APK}"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "${APK}"
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" -c -v 4 "${APK}" >/dev/null

          unzip -l "${APK}" | grep -q 'lib/arm64-v8a/libParallaxELiteCore.so'

          DEX_DIR=$(mktemp -d)
          unzip -qq "${APK}" 'classes*.dex' -d "${DEX_DIR}"
          : > "${BUILD_LOG_DIR}/dexdump.txt"
          for dex in "${DEX_DIR}"/classes*.dex; do
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/dexdump" -d "${dex}" \
              >> "${BUILD_LOG_DIR}/dexdump.txt"
          done

          grep -q 'Lcom/parallax/ELite;' "${BUILD_LOG_DIR}/dexdump.txt"
          if grep -q 'Ltop/niunaijun/blackbox/BlackBoxCore;' "${BUILD_LOG_DIR}/dexdump.txt"; then
            echo 'Legacy BlackBoxCore API is still packaged.' >&2
            exit 1
          fi

          {
            echo "branch=ParallaxELiteLoader"
            echo "workflow=ELiteLoaderBuild"
            echo "elite_sdk_ref=${ELITE_SDK_REF}"
            echo "transport=${ELITE_LOADER_TRANSPORT}"
            echo "signing=${ELITE_LOADER_SIGNING}"
            sha256sum "${LOADER_AAR}" "${APK}"
          } | tee "${BUILD_LOG_DIR}/ELiteLoaderBuild-info.txt"

      - name: Upload ParallaxELiteLoader release APK
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxELiteLoader-release-apk
          path: ${{ env.LOADER_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload ParallaxELite SDK AAR
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxELiteLoader-sdk-aar
          path: ${{ env.LOADER_AAR }}
          if-no-files-found: error

      - name: Upload ELiteLoaderBuild logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELiteLoaderBuild-logs
          path: ${{ env.BUILD_LOG_DIR }}/
          if-no-files-found: warn
