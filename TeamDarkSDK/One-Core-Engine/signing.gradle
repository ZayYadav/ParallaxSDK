android {
    signingConfigs {
        release {
            def properties
            def propertiesFile = rootProject.file('signing.properties')
            if (propertiesFile.exists()) {
                properties = new Properties()
                properties.load(propertiesFile.newDataInputStream())
            }
            def getString = { String propertyName, String environmentName, String prompt ->
                return System.getenv(environmentName) ?: properties?.get(propertyName) ?:
                        System.console()?.readLine('\n' + prompt + ': ')
            }

            storeFile getString('storeFile', 'STORE_FILE', 'Store file')?.with(rootProject.&file)
            storePassword getString('storePassword', 'STORE_PASSWORD', 'Store password')
            keyAlias getString('keyAlias', 'KEY_ALIAS', 'Key alias')
            keyPassword getString('keyPassword', 'KEY_PASSWORD', 'Key password')

            // minSdk is 24, so every supported Android version understands APK
            // Signature Scheme v2. Dropping legacy JAR/v1 signatures removes the
            // large META-INF manifest/signature files from the production APK.
            v1SigningEnabled false
            v2SigningEnabled true
        }
        debug {
            def properties
            def propertiesFile = rootProject.file('signing.properties')
            if (propertiesFile.exists()) {
                properties = new Properties()
                properties.load(propertiesFile.newDataInputStream())
            }
            def getString = { String propertyName, String environmentName, String prompt ->
                return System.getenv(environmentName) ?: properties?.get(propertyName) ?:
                        System.console()?.readLine('\n' + prompt + ': ')
            }

            def configuredStore = getString('storeFile', 'STORE_FILE', 'Store file')?.with(rootProject.&file)
            if (configuredStore != null && configuredStore.exists()) {
                storeFile configuredStore
                storePassword getString('storePassword', 'STORE_PASSWORD', 'Store password')
                keyAlias getString('keyAlias', 'KEY_ALIAS', 'Key alias')
                keyPassword getString('keyPassword', 'KEY_PASSWORD', 'Key password')
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
}
