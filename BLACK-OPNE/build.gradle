// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.lsposed.lsparanoid:gradle-plugin:0.6.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content {
                // JitPack is required only for explicitly GitHub-backed dependencies.
                // Scoping prevents unrelated coordinates from being resolved there.
                includeGroupByRegex 'com\\.github\\..*'
            }
        }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    minSdk = 24
    ndkVersion = '27.2.12479018'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    targetSdk = 36
    versionName = '2.0.0'
    versionCode = 2
    xVersion = '1.1.0'
    blackReflection = '1.1.4'
}
