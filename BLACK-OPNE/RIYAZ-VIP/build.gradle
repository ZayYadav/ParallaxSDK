plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.lsposed.lsparanoid'
}

// Public V3 trust anchors have a single source of truth shared with the panel.
// A standalone SDK checkout can still supply the same values explicitly through
// Gradle properties, but a full repository build must not silently drift from
// panels/sdk-panel/sdk-v3-public-trust.json.
def sdkTrustFile = new File(rootProject.projectDir.parentFile, 'panels/sdk-panel/sdk-v3-public-trust.json')
def sdkTrust = [:]
if (sdkTrustFile.isFile()) {
    sdkTrust = new groovy.json.JsonSlurper().parse(sdkTrustFile) as Map
} else {
    sdkTrust = [
        contract_version       : 3,
        key_id                 : providers.gradleProperty('sdkPanelKeyId').orNull,
        ecdh_public_key_b64    : providers.gradleProperty('sdkPanelEcdhPublicKey').orNull,
        signing_public_key_b64 : providers.gradleProperty('sdkPanelSigningPublicKey').orNull,
    ]
}

def requiredTrustString = { String name ->
    def value = sdkTrust[name]?.toString()?.trim()
    if (!value) {
        throw new GradleException("Missing SDK V3 trust value '${name}'. Keep sdk-v3-public-trust.json with the SDK or pass the documented Gradle property override.")
    }
    value
}

def sdkPanelKeyId = requiredTrustString('key_id')
def sdkPanelEcdhPublicKey = requiredTrustString('ecdh_public_key_b64')
def sdkPanelSigningPublicKey = requiredTrustString('signing_public_key_b64')
if ((sdkTrust.contract_version as Integer) != 3) {
    throw new GradleException('SDK panel public trust contract must be version 3.')
}
if (!(sdkPanelKeyId ==~ /[A-Za-z0-9._-]{1,64}/)) {
    throw new GradleException('SDK panel key id is invalid.')
}
for (def entry : [ecdh: sdkPanelEcdhPublicKey, signing: sdkPanelSigningPublicKey]) {
    byte[] der
    try {
        der = java.util.Base64.decoder.decode(entry.value)
    } catch (IllegalArgumentException ignored) {
        throw new GradleException("SDK panel ${entry.key} public key is not valid Base64.")
    }
    if (der.length < 80 || der.length > 160) {
        throw new GradleException("SDK panel ${entry.key} public key has an invalid DER length.")
    }
}
if (sdkPanelEcdhPublicKey == sdkPanelSigningPublicKey) {
    throw new GradleException('SDK panel ECDH and response-signing public keys must be different.')
}
def buildConfigQuote = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// Keep the reflection-heavy virtualization startup bytecode stable. Only the
// release auth/activation boundary is transformed at build time.
lsparanoid {
    seed = 0x50415241
    includeDependencies = false
    variantFilter = { variant ->
        variant.buildType == 'release'
    }
}

android {

    compileSdk rootProject.ext.compileSdk
    buildToolsVersion rootProject.ext.buildToolsVersion

    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        consumerProguardFiles 'proguard.txt'

        // These are public trust anchors, not secrets. Their source is shared
        // with the SDK panel so client/server key drift fails at build/deploy
        // verification instead of appearing as an unexplained activation error.
        buildConfigField 'String', 'SDK_PANEL_KEY_ID', buildConfigQuote(sdkPanelKeyId)
        buildConfigField 'String', 'SDK_PANEL_ECDH_PUBLIC_KEY', buildConfigQuote(sdkPanelEcdhPublicKey)
        buildConfigField 'String', 'SDK_PANEL_SIGNING_PUBLIC_KEY', buildConfigQuote(sdkPanelSigningPublicKey)

        ndk {
            // Ship every ABI supported by current Android devices and emulators.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            // Stability mode: keep the SDK bytecode untouched while loader startup is debugged.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
           path "src/main/cpp/Android.mk"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        aidl true
        prefab true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textReport false
        checkOnly += ['NewApi', 'InlinedApi']
    }

    namespace "top.niunaijun.blackbox"
    ndkVersion rootProject.ext.ndkVersion
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}

// A normal AAR must be readable by Gradle, so it cannot remain encrypted while
// it is being consumed. This task creates an authenticated encrypted envelope
// for storage/delivery. Use a different 32-byte key for every client and pass it
// only through the environment; no reusable distribution key is embedded here.
tasks.register('encryptReleaseAar') {
    group = 'distribution'
    description = 'Builds release AAR and wraps it in an AES-256-GCM .aar.pxa envelope.'
    dependsOn 'assembleRelease'

    def releaseAar = layout.buildDirectory.file('outputs/aar/ParallaxCore-release.aar')
    def encryptedAar = layout.buildDirectory.file('outputs/encrypted-aar/ParallaxCore-v3-release.aar.pxa')
    inputs.file(releaseAar)
    outputs.file(encryptedAar)

    doLast {
        def encodedKey = System.getenv('PARALLAX_AAR_ENCRYPTION_KEY')
        if (!encodedKey) {
            throw new GradleException('Set PARALLAX_AAR_ENCRYPTION_KEY to a Base64-encoded 32-byte per-client key.')
        }

        byte[] keyBytes
        try {
            keyBytes = java.util.Base64.decoder.decode(encodedKey.trim())
        } catch (IllegalArgumentException ignored) {
            throw new GradleException('PARALLAX_AAR_ENCRYPTION_KEY must be valid Base64.')
        }
        if (keyBytes.length != 32) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException('PARALLAX_AAR_ENCRYPTION_KEY must decode to exactly 32 bytes.')
        }

        byte[] plaintext = releaseAar.get().asFile.bytes
        byte[] nonce = new byte[12]
        new java.security.SecureRandom().nextBytes(nonce)
        byte[] aad = 'ParallaxSDK-AAR-v1'.getBytes(java.nio.charset.StandardCharsets.US_ASCII)
        def cipher = javax.crypto.Cipher.getInstance('AES/GCM/NoPadding')
        cipher.init(javax.crypto.Cipher.ENCRYPT_MODE,
                new javax.crypto.spec.SecretKeySpec(keyBytes, 'AES'),
                new javax.crypto.spec.GCMParameterSpec(128, nonce))
        cipher.updateAAD(aad)
        byte[] encrypted = cipher.doFinal(plaintext)

        def output = encryptedAar.get().asFile
        output.parentFile.mkdirs()
        output.withOutputStream { stream ->
            stream.write('PXAAR1'.getBytes(java.nio.charset.StandardCharsets.US_ASCII))
            stream.write(nonce.length)
            stream.write(nonce)
            stream.write(encrypted)
        }

        java.util.Arrays.fill(keyBytes, (byte) 0)
        java.util.Arrays.fill(plaintext, (byte) 0)
        logger.lifecycle("Encrypted release AAR: ${output}")
    }
}

tasks.register('decryptReleaseAar') {
    group = 'distribution'
    description = 'Authenticates and decrypts a Parallax .aar.pxa envelope for local Gradle consumption.'

    doLast {
        def encodedKey = System.getenv('PARALLAX_AAR_ENCRYPTION_KEY')
        if (!encodedKey) {
            throw new GradleException('Set PARALLAX_AAR_ENCRYPTION_KEY to the client-specific Base64 key.')
        }

        byte[] keyBytes
        try {
            keyBytes = java.util.Base64.decoder.decode(encodedKey.trim())
        } catch (IllegalArgumentException ignored) {
            throw new GradleException('PARALLAX_AAR_ENCRYPTION_KEY must be valid Base64.')
        }
        if (keyBytes.length != 32) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException('PARALLAX_AAR_ENCRYPTION_KEY must decode to exactly 32 bytes.')
        }

        def input = project.findProperty('parallaxEncryptedAar')
                ? file(project.property('parallaxEncryptedAar'))
                : layout.buildDirectory.file('outputs/encrypted-aar/ParallaxCore-v3-release.aar.pxa').get().asFile
        if (!input.isFile()) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException("Encrypted AAR not found: ${input}")
        }

        byte[] envelope = input.bytes
        byte[] magic = 'PXAAR1'.getBytes(java.nio.charset.StandardCharsets.US_ASCII)
        if (envelope.length < magic.length + 1 + 12 + 16
                || !java.util.Arrays.equals(java.util.Arrays.copyOfRange(envelope, 0, magic.length), magic)) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException('Invalid encrypted AAR envelope.')
        }
        int nonceLength = envelope[magic.length] & 0xff
        if (nonceLength != 12 || envelope.length <= magic.length + 1 + nonceLength + 16) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException('Invalid encrypted AAR nonce or payload.')
        }
        int payloadOffset = magic.length + 1 + nonceLength
        byte[] nonce = java.util.Arrays.copyOfRange(envelope, magic.length + 1, payloadOffset)
        byte[] ciphertext = java.util.Arrays.copyOfRange(envelope, payloadOffset, envelope.length)
        byte[] aad = 'ParallaxSDK-AAR-v1'.getBytes(java.nio.charset.StandardCharsets.US_ASCII)
        def cipher = javax.crypto.Cipher.getInstance('AES/GCM/NoPadding')
        cipher.init(javax.crypto.Cipher.DECRYPT_MODE,
                new javax.crypto.spec.SecretKeySpec(keyBytes, 'AES'),
                new javax.crypto.spec.GCMParameterSpec(128, nonce))
        cipher.updateAAD(aad)
        byte[] plaintext
        try {
            plaintext = cipher.doFinal(ciphertext)
        } catch (java.security.GeneralSecurityException ignored) {
            java.util.Arrays.fill(keyBytes, (byte) 0)
            throw new GradleException('Encrypted AAR authentication failed: wrong key or modified file.')
        }

        def output = project.findProperty('parallaxDecryptedAarOutput')
                ? file(project.property('parallaxDecryptedAarOutput'))
                : layout.buildDirectory.file('outputs/decrypted-aar/ParallaxCore-v3-release.aar').get().asFile
        output.parentFile.mkdirs()
        output.bytes = plaintext
        java.util.Arrays.fill(keyBytes, (byte) 0)
        java.util.Arrays.fill(plaintext, (byte) 0)
        logger.lifecycle("Verified decrypted AAR: ${output}")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.2'

    compileOnly "com.google.auto.service:auto-service:1.1.1"
    annotationProcessor "com.google.auto.service:auto-service:1.1.1"
    implementation "com.squareup:javapoet:1.13.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
    testImplementation 'junit:junit:4.13.2'
}
