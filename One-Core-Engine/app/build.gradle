import java.security.KeyStore
import java.security.MessageDigest
import java.util.Base64
import javax.imageio.ImageIO
import javax.imageio.IIOImage
import javax.imageio.ImageWriteParam
import java.awt.image.BufferedImage
import java.awt.RenderingHints

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.lsposed.lsparanoid'
}

apply from: '../signing.gradle'

def parallaxApiPublicKey = providers.gradleProperty('parallaxApiPublicKey')
        .orElse(System.getenv('PARALLAX_API_PUBLIC_KEY_B64') ?: '')
        .get()

def oneCoreAllowedSigningSha256 = providers.gradleProperty('onecoreAllowedSigningSha256')
        .orElse(System.getenv('ONECORE_ALLOWED_SIGNING_SHA256') ?: '')
        .get()
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
// Keep the user's supplied artwork as the untouched master outside res/. Every build creates
// a compact, valid JPEG resource from it so launcher/UI branding stays faithful without adding
// ~1.8 MB to every APK.
def oneCoreBrandMaster = file("${projectDir}/branding/parallax_labs_brand.jpg")
def oneCoreBrandGeneratedResDir = file("${buildDir}/generated/onecore-brand/res")
def oneCoreBrandGeneratedFile = file("${oneCoreBrandGeneratedResDir}/drawable-nodpi/parallax_labs_brand.jpg")

tasks.register('generateOneCoreBrandAsset') {
    inputs.file(oneCoreBrandMaster)
    outputs.file(oneCoreBrandGeneratedFile)

    doLast {
        System.setProperty('java.awt.headless', 'true')
        if (!oneCoreBrandMaster.exists()) {
            throw new GradleException("Missing OneCore Edge master artwork: ${oneCoreBrandMaster}")
        }

        BufferedImage source = ImageIO.read(oneCoreBrandMaster)
        if (source == null) {
            throw new GradleException('OneCore Edge master artwork is not a readable image')
        }

        final int edge = 512
        BufferedImage scaled = new BufferedImage(edge, edge, BufferedImage.TYPE_INT_RGB)
        def graphics = scaled.createGraphics()
        try {
            graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
            graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
            graphics.drawImage(source, 0, 0, edge, edge, null)
        } finally {
            graphics.dispose()
        }

        oneCoreBrandGeneratedFile.parentFile.mkdirs()
        def writers = ImageIO.getImageWritersByFormatName('jpeg')
        if (!writers.hasNext()) {
            throw new GradleException('No JPEG writer is available in the build JDK')
        }

        def writer = writers.next()
        def output = ImageIO.createImageOutputStream(oneCoreBrandGeneratedFile)
        try {
            writer.output = output
            def params = writer.defaultWriteParam
            if (params.canWriteCompressed()) {
                params.compressionMode = ImageWriteParam.MODE_EXPLICIT
                params.compressionQuality = 0.72f
            }
            writer.write(null, new IIOImage(scaled, null, null), params)
        } finally {
            writer.dispose()
            output?.close()
        }

        logger.lifecycle("Generated optimized OneCore Edge artwork: ${oneCoreBrandGeneratedFile.length()} bytes")
    }
}

tasks.configureEach { task ->
    if (task.name == 'preDebugBuild' || task.name == 'preReleaseBuild'
            || task.name == 'mergeDebugResources' || task.name == 'mergeReleaseResources') {
        task.dependsOn('generateOneCoreBrandAsset')
    }
}

// Release builds still require the application-layer API public key. TLS server identity is
// validated by Android/OkHttp's platform trust store and hostname verifier; the Loader no longer
// embeds or requires certificate/SPKI pins.
if (releaseTaskRequested) {
    byte[] publicKeyDer
    try {
        publicKeyDer = Base64.decoder.decode(parallaxApiPublicKey)
    } catch (IllegalArgumentException error) {
        throw new GradleException('PARALLAX_API_PUBLIC_KEY_B64 is invalid for release builds', error)
    }
    if (publicKeyDer.length < 256 || publicKeyDer.length > 1024) {
        throw new GradleException('PARALLAX_API_PUBLIC_KEY_B64 has an invalid DER size')
    }
}

def getSigningCertificateSha256 = { signingConfig ->
    if (signingConfig == null || signingConfig.storeFile == null || !signingConfig.storeFile.exists()) {
        return ""
    }

    def storePassword = signingConfig.storePassword ?: ""
    def keyAlias = signingConfig.keyAlias
    def storeTypes = ["JKS", "PKCS12"]
    def lastError = null

    for (def storeType : storeTypes) {
        try {
            def keyStore = KeyStore.getInstance(storeType)
            signingConfig.storeFile.withInputStream { input ->
                keyStore.load(input, storePassword.toCharArray())
            }
            def certificate = keyStore.getCertificate(keyAlias)
            if (certificate != null) {
                def digest = MessageDigest.getInstance("SHA-256").digest(certificate.encoded)
                return digest.collect { String.format("%02X", it) }.join()
            }
        } catch (Exception e) {
            lastError = e
        }
    }

    logger.warn("Unable to read signing certificate SHA-256 from ${signingConfig.storeFile}: ${lastError?.message}")
    return ""
}

def normalizeSigningDigestList = { String raw ->
    if (raw == null || raw.trim().isEmpty()) {
        return ""
    }
    def normalized = raw.split('[,;]', -1)
            .collect { it.replace(':', '').trim().toUpperCase(Locale.ROOT) }
            .findAll { !it.isEmpty() }
    if (normalized.isEmpty() || normalized.any { !(it ==~ /^[0-9A-F]{64}$/) }) {
        throw new GradleException('Signing SHA-256 configuration must contain 64-digit hex digests')
    }
    return normalized.unique().join(',')
}

def bindNativeSigningIdentity = { signingConfig, String configured, boolean required ->
    String actual = normalizeSigningDigestList(getSigningCertificateSha256(signingConfig))
    String expected = normalizeSigningDigestList(configured ?: actual)
    if (required && (actual.isEmpty() || expected.isEmpty())) {
        throw new GradleException('Release signing certificate identity is unavailable')
    }
    if (!actual.isEmpty() && !expected.isEmpty()
            && !expected.split(',').contains(actual)) {
        throw new GradleException('Configured signing identity does not match the selected keystore certificate')
    }
    return expected
}

// Keep this closure detached from the Gradle extension. LSParanoid exposes the
// callback as a cacheable task @Input, so a normal nested Groovy closure captures
// LSParanoidExtension and fails Gradle 8.x input fingerprint serialization.
def loaderStringClassFilter = { String className ->
    className.startsWith('com.onecore.loader.')
            && className != 'com.onecore.loader.BoxApplication'
            && !className.startsWith('com.onecore.loader.BoxApplication$')
            && className != 'com.onecore.loader.security.NativeSigningVerifier'
            && !className.startsWith('com.onecore.loader.security.NativeSigningVerifier$')
            && className != 'com.onecore.loader.BuildConfig'
            && className != 'com.onecore.loader.R'
            && !className.startsWith('com.onecore.loader.R$')
            && className != 'com.onecore.loader.BR'
            && !className.startsWith('com.onecore.loader.databinding.')
}.dehydrate()

// Release builds protect string constants throughout first-party Loader code.
// Startup/JNI/generated classes stay out of the transformer so framework and
// native entry points keep the same stability characteristics as the green build.
lsparanoid {
    seed = 0x50415241
    includeDependencies = false
    classFilter = loaderStringClassFilter
    variantFilter = { variant ->
        variant.buildType == 'release'
    }
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace rootProject.ext.LoaderPkg

    sourceSets {
        main {
            res.srcDir oneCoreBrandGeneratedResDir
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId rootProject.ext.LoaderPkg
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep default resources plus the only explicitly supported translation.
        // This removes unused language packs contributed by dependencies.
        resourceConfigurations += ['en']
        buildConfigField "String", "PARALLAX_API_PUBLIC_KEY_B64", javaString(parallaxApiPublicKey)

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
            def debugSigningSha256 = bindNativeSigningIdentity(
                    signingConfigs.debug, oneCoreAllowedSigningSha256, false)
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", javaString(debugSigningSha256)
            externalNativeBuild {
                ndkBuild {
                    arguments "ONECORE_SIGNING_SHA256=${debugSigningSha256}"
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            jniDebuggable false
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.release
            def releaseSigningSha256 = bindNativeSigningIdentity(
                    signingConfigs.release, oneCoreAllowedSigningSha256, true)
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", javaString(releaseSigningSha256)
            externalNativeBuild {
                ndkBuild {
                    arguments "ONECORE_SIGNING_SHA256=${releaseSigningSha256}"
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    ndkVersion rootProject.ext.ndkVersion

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        jniLibs {
            // Compressed native libraries minimize APK download/on-disk package size.
            useLegacyPackaging true
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/**/LICENSE',
                    'META-INF/**/LICENSE.txt',
                    'META-INF/**/NOTICE',
                    'META-INF/**/NOTICE.txt'
            ]
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'com.android.tools.build:apksig:8.11.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation "com.github.topjohnwu.libsu:core:3.1.1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
