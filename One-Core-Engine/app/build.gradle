import java.security.KeyStore
import java.security.MessageDigest

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.lsposed.lsparanoid'
}

apply from: '../signing.gradle'


def getSigningCertificateSha256 = { signingConfig ->
    if (signingConfig == null || signingConfig.storeFile == null || !signingConfig.storeFile.exists()) {
        return ""
    }

    def storePassword = signingConfig.storePassword ?: ""
    def keyAlias = signingConfig.keyAlias
    def storeTypes = ["JKS", "PKCS12"]
    def lastError = null

    for (def storeType : storeTypes) {
        try {
            def keyStore = KeyStore.getInstance(storeType)
            signingConfig.storeFile.withInputStream { input ->
                keyStore.load(input, storePassword.toCharArray())
            }
            def certificate = keyStore.getCertificate(keyAlias)
            if (certificate != null) {
                def digest = MessageDigest.getInstance("SHA-256").digest(certificate.encoded)
                return digest.collect { String.format("%02X", it) }.join()
            }
        } catch (Exception e) {
            lastError = e
        }
    }

    logger.warn("Unable to read signing certificate SHA-256 from ${signingConfig.storeFile}: ${lastError?.message}")
    return ""
}

android {
    
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace rootProject.ext.LoaderPkg
    
    lint {
      baseline = file("lint-baseline.xml")
    }
    
    defaultConfig {
        applicationId rootProject.ext.LoaderPkg
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            // OneCore Engine APKs intentionally target modern 64-bit ARM devices only.
            abiFilters "arm64-v8a"
        }
    
    }
    
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", "\"${getSigningCertificateSha256(signingConfigs.debug)}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            jniDebuggable false
            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.release
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", "\"${getSigningCertificateSha256(signingConfigs.release)}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    ndkVersion rootProject.ext.ndkVersion
    
    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
            
        }
    }

    packaging {
        jniLibs {
            // The virtualized runtime consumes extracted native libraries by path.
            useLegacyPackaging true
        }
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation "com.github.topjohnwu.libsu:core:3.1.1"
    implementation 'io.github.molihuan:pathselector:1.1.16'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    testImplementation 'junit:junit:4.13.2'
}
