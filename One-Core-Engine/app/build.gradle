import java.security.KeyStore
import java.security.MessageDigest
import java.util.Base64

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

apply from: '../signing.gradle'

def parallaxApiPublicKey = providers.gradleProperty('parallaxApiPublicKey')
        .orElse(System.getenv('PARALLAX_API_PUBLIC_KEY_B64') ?: '')
        .get()
def parallaxTlsPins = providers.gradleProperty('parallaxTlsPins')
        .orElse(System.getenv('PARALLAX_TLS_PINS') ?: '')
        .get()
def oneCoreAllowedSigningSha256 = providers.gradleProperty('onecoreAllowedSigningSha256')
        .orElse(System.getenv('ONECORE_ALLOWED_SIGNING_SHA256') ?: '')
        .get()
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
if (releaseTaskRequested) {
    byte[] publicKeyDer
    try {
        publicKeyDer = Base64.decoder.decode(parallaxApiPublicKey)
    } catch (IllegalArgumentException error) {
        throw new GradleException('PARALLAX_API_PUBLIC_KEY_B64 is invalid for release builds', error)
    }
    if (publicKeyDer.length < 256 || publicKeyDer.length > 1024) {
        throw new GradleException('PARALLAX_API_PUBLIC_KEY_B64 has an invalid DER size')
    }
    def configuredPins = parallaxTlsPins.split(',', -1).collect { it.trim() }
    if (configuredPins.isEmpty() || configuredPins.any { !(it ==~ /^sha256\/[A-Za-z0-9+\/]{43}=$/) }) {
        throw new GradleException('PARALLAX_TLS_PINS must contain valid SHA-256 pins for release builds')
    }
}

def getSigningCertificateSha256 = { signingConfig ->
    if (signingConfig == null || signingConfig.storeFile == null || !signingConfig.storeFile.exists()) {
        return ""
    }

    def storePassword = signingConfig.storePassword ?: ""
    def keyAlias = signingConfig.keyAlias
    def storeTypes = ["JKS", "PKCS12"]
    def lastError = null

    for (def storeType : storeTypes) {
        try {
            def keyStore = KeyStore.getInstance(storeType)
            signingConfig.storeFile.withInputStream { input ->
                keyStore.load(input, storePassword.toCharArray())
            }
            def certificate = keyStore.getCertificate(keyAlias)
            if (certificate != null) {
                def digest = MessageDigest.getInstance("SHA-256").digest(certificate.encoded)
                return digest.collect { String.format("%02X", it) }.join()
            }
        } catch (Exception e) {
            lastError = e
        }
    }

    logger.warn("Unable to read signing certificate SHA-256 from ${signingConfig.storeFile}: ${lastError?.message}")
    return ""
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace rootProject.ext.LoaderPkg

    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId rootProject.ext.LoaderPkg
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "PARALLAX_API_PUBLIC_KEY_B64", javaString(parallaxApiPublicKey)
        buildConfigField "String", "PARALLAX_TLS_PINS", javaString(parallaxTlsPins)

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.debug
            def debugSigningSha256 = oneCoreAllowedSigningSha256 ?: getSigningCertificateSha256(signingConfigs.debug)
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", javaString(debugSigningSha256)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            debuggable false
            jniDebuggable false
            // Temporary stability mode: keep bytecode untouched while diagnosing startup VerifyError.
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
            def releaseSigningSha256 = oneCoreAllowedSigningSha256 ?: getSigningCertificateSha256(signingConfigs.release)
            buildConfigField "String", "EXPECTED_SIGNATURE_SHA256", javaString(releaseSigningSha256)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    ndkVersion rootProject.ext.ndkVersion

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'com.android.tools.build:apksig:8.11.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation "com.github.topjohnwu.libsu:core:3.1.1"
    implementation 'io.github.molihuan:pathselector:1.1.16'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'com.github.CodingGay.BlackReflection:core:1.1.4'
    annotationProcessor 'com.github.CodingGay.BlackReflection:compiler:1.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
